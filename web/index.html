<title>Streetball Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;700&display=swap">
<style>
/* Layout: one 10:7 game canvas centered on a night-court ground, touch pad underneath on phones. Single dark look on purpose. */
:root {
  --ground: #101116;
  --panel: #1b1d25;
  --line: #3a3d4a;
  --ink: #eef0f2;
  --muted: #9296a3;
  --ball: #eb8228;
  --crown: #f5c83c;
  --display: "Bungee", Impact, "Arial Black", sans-serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  padding-inline: 16px;
  padding-block: 12px;
  box-sizing: border-box;
}
#wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
#stage { position: relative; width: 100%; aspect-ratio: 10 / 7; max-width: 100%; }
#game {
  width: 100%; height: 100%; display: block; border-radius: 10px;
  background: var(--panel); outline: none; touch-action: none;
}
#game:focus-visible { box-shadow: 0 0 0 3px var(--crown); }
#name-input {
  position: absolute; left: 30%; top: 26.4%; width: 40%; height: 7.2%;
  box-sizing: border-box; border: 2px solid var(--crown); border-radius: 6px;
  background: #282a34; color: var(--ink); text-align: center;
  font: 700 clamp(14px, 3.2vw, 30px) var(--body);
}
#hint { color: var(--muted); font-size: 14px; text-align: center; margin: 0; }
#pad { display: none; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; user-select: none; -webkit-user-select: none; }
#pad.show { display: grid; }
.dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
.pb {
  border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 10px; font: 700 15px var(--body); letter-spacing: .04em;
  touch-action: none; min-width: 52px; min-height: 52px;
}
.pb:active, .pb.on { background: #2c2f3b; border-color: var(--crown); }
.pb.big { background: var(--ball); color: #1a0f05; border-color: var(--ball); min-width: 84px; min-height: 84px; border-radius: 50%; font-size: 17px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.mid { display: flex; justify-content: center; }
@media (prefers-reduced-motion: reduce) { .pb { transition: none; } }
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="game" tabindex="0" aria-label="Streetball Kingdom game. Click to focus, then use the keyboard."></canvas>
    <input id="name-input" maxlength="14" placeholder="Type your name" autocomplete="off" hidden>
  </div>
  <p id="hint">Click the game, then play with the keyboard. On a phone, tap menus and use the buttons below.</p>
  <div id="pad" aria-label="Touch controls">
    <div class="dpad">
      <span></span><button class="pb" data-dir="up" aria-label="Up">▲</button><span></span>
      <button class="pb" data-dir="left" aria-label="Left">◀</button><span></span><button class="pb" data-dir="right" aria-label="Right">▶</button>
      <span></span><button class="pb" data-dir="down" aria-label="Down">▼</button><span></span>
    </div>
    <div class="mid"><button class="pb" id="b-pause">PAUSE</button></div>
    <div class="acts">
      <button class="pb" id="b-sprint">SPRINT</button>
      <button class="pb" id="b-switch">SWITCH</button>
      <button class="pb" id="b-move">MOVE / STEAL</button>
      <button class="pb" id="b-spin">SPIN</button>
      <button class="pb" id="b-pass">PASS</button>
      <button class="pb big" id="b-shoot">SHOOT</button>
    </div>
  </div>
</div>

<script>
"use strict";
// =====================================================================
// Settings (same numbers as game/settings.py)
// =====================================================================
const S = {
  W: 1000, H: 700,
  CL: 100, CT: 60, CR: 900, CB: 640,
  HOOP: [500, 115], ARC: 250, PAINT_HW: 80, PAINT_D: 190, CHECK: [500, 450],
  GAME_TO: 21, HALF: 11, SHOT_CLOCK: 14,
  PR: 14, BASE_SPEED: 145, SPEED_PER: 1.6, PASS_SPEED: 600, ACCEL: 8, SPRINT: 1.35, STAMINA_DRAIN: 0.42, STAMINA_REGEN: 0.22, ENERGY_DRAIN: 0.004, ENERGY_SPRINT: 0.005, ENERGY_REST: 0.012, GASSED: 0.4,
  METER_TIME: 0.5, METER_SWEET: 0.8, WIN_NEAR: 0.085, WIN_FAR: 0.028,
  DUNK_BASE: 0.82, LAYUP: 95, LAYUP_BASE: 0.6,
  STEAL_RANGE: 36, STEAL_BASE: 0.16, BLOCK_RANGE: 36, BLOCK_BASE: 0.10, GRAB: 20,
  MAIN_MAX: 5, SEC_MAX: 3, SEC_PCT: 0.5, SEC_UNLOCK: 4, THIRD_PCT: 0.35,
  CREW_MAX: 6, STAT_MAX: 99, STAT_STEP: 2,
  STATS: ["shooting", "speed", "handles", "defense", "rebounding"],
  LABEL: { shooting: "Shooting", speed: "Speed", handles: "Handles", defense: "Defense", rebounding: "Rebounding" },
};
const C = {
  white: "#f0f0f0", grey: "#8c8c96", dark: "#1c1c22", gold: "#f5c83c", green: "#5ad26e",
  red: "#e15046", orange: "#eb8228", blue: "#5096f0", black: "#0f0f12",
  team: ["#3c82eb", "#d7413c"], bg: "#12141a", bar: "#1e202a",
};
const SAVE_KEY = "streetball-kingdom-v1";   // the old single save (moved into slot 1)
const SLOTS = 5, slotKey = i => `streetball-kingdom-slot-${i}`;
try { const old = localStorage.getItem(SAVE_KEY); if (old && !localStorage.getItem(slotKey(0))) { localStorage.setItem(slotKey(0), old); localStorage.removeItem(SAVE_KEY); } } catch (e) { /* no storage */ }
// Player looks (picked from each player's name so they stay the same)
const SKINS = ["#8d5524", "#c68642", "#e0ac69", "#f1c27d", "#5c3a1e", "#a0673c", "#3d2314", "#ffdbac"];
const HAIRS = ["#1b1410", "#2e1d12", "#5a3a1c", "#0e0e0e", "#8a5a2b", "#d8b26a"];
const SHOES = ["#f2f2f2", "#141414", "#e04a3a", "#2f7de0", "#f5c83c", "#3ecf7a"];

// =====================================================================
// Random numbers (seedable so crews are the same every visit)
// =====================================================================
function hashStr(s) { let h = 2166136261 >>> 0; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
class Rng {
  constructor(seed) { this.s = typeof seed === "string" ? hashStr(seed) : (seed ?? Math.floor(Math.random() * 2 ** 32)) >>> 0; }
  random() { let t = (this.s += 0x6D2B79F5) >>> 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  uniform(a, b) { return a + (b - a) * this.random(); }
  randint(a, b) { return a + Math.floor(this.random() * (b - a + 1)); }
  choice(arr) { return arr[Math.floor(this.random() * arr.length)]; }
  choices(arr, w) { const tot = w.reduce((a, b) => a + b, 0); let r = this.random() * tot; for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r < 0) return arr[i]; } return arr[arr.length - 1]; }

}

// =====================================================================
// Geometry
// =====================================================================
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function norm(x, y) { const d = Math.hypot(x, y); return d > 1e-6 ? [x / d, y / d] : [0, 0]; }
const shotPoints = pos => dist(pos, S.HOOP) > S.ARC ? 2 : 1;
const beyondArc = (pos, m = 0) => dist(pos, S.HOOP) > S.ARC + m;
const clampCourt = (x, y, pad = S.PR) => [clamp(x, S.CL + pad, S.CR - pad), clamp(y, S.CT + pad, S.CB - pad)];

// =====================================================================
// Attributes: Main gets full effect (max 5), Secondary gets SEC_PCT (max 3)
// =====================================================================
const ATTRS = {
  sharpshooter: { name: "Sharpshooter", desc: "Better from behind the arc and a wider green zone on the shot meter.", fx: { deep: 0.035, meter: 0.012 } },
  dunker: { name: "Dunker", desc: "Shoot near the rim to dunk. Dunks are hard to block and go in more.", fx: { dunk: 0.05, finish: 0.02 } },
  lockdown: { name: "Lockdown", desc: "Steals work more often and the shooters you guard miss more.", fx: { steal: 0.035, contest: 0.03 } },
  glass: { name: "Glass Cleaner", desc: "Win more rebounds and grab them from farther away.", fx: { rebound: 0.15, reach: 3 } },
  playmaker: { name: "Playmaker", desc: "Faster passes that get picked off less, and crossovers that break ankles.", fx: { pass: 0.08, cross: 0.05 } },
  speedster: { name: "Speedster", desc: "Higher top speed on both ends of the court.", fx: { speed: 0.035 } },
};
const ATTR_ORDER = Object.keys(ATTRS);
const MAIN_COSTS = [100, 150, 300, 550, 900];
const SEC_COSTS = [200, 400, 700];
const maxLevel = slot => slot === "main" ? S.MAIN_MAX : S.SEC_MAX;
function upgradeCost(slot, lvl) { const c = slot === "main" ? MAIN_COSTS : SEC_COSTS; return lvl >= c.length ? null : c[lvl]; }
function effect(p, key) {
  let t = 0;
  if (p.main) t += (ATTRS[p.main].fx[key] || 0) * p.mainLvl;
  if (p.sec) t += (ATTRS[p.sec].fx[key] || 0) * p.secLvl * S.SEC_PCT;
  if (p.third) t += (ATTRS[p.third].fx[key] || 0) * (p.thirdLvl || 0) * S.THIRD_PCT;
  return t;
}
const canDunk = p => (p.main === "dunker" && p.mainLvl > 0) || (p.sec === "dunker" && p.secLvl > 0) || (p.third === "dunker" && p.thirdLvl > 0);
// ---- Attributes (badge-style): you earn them at OVR milestones and equip them in limited slots.
// Teammates can buy them; better opponents come with them. (Your Sharpshooter/Dunker/etc. pick is your Archetype.)
const BADGES = {
  combo: { name: "Combo Dribbler", short: "Combo", league: 3, price: 400, pos: ["PG", "SG", "SF"], desc: "Chain two dribble moves with no delay, then a longer cooldown." },
  firststep: { name: "Quick First Step", short: "1st Step", league: 3, price: 350, pos: ["PG", "SG", "SF"], desc: "Crossovers, cross & drives and hesi-gos explode into a burst of speed." },
  ankles: { name: "Ankle Breaker", short: "Ankles", league: 3, price: 450, pos: ["PG", "SG"], desc: "Your moves break ankles 30% more, and defenders stay down longer." },
  deadeye: { name: "Deadeye", short: "Deadeye", league: 5, price: 500, pos: ["SG", "SF", "PG"], desc: "Contests hurt your shots 30% less." },
  range: { name: "Limitless Range", short: "Range", league: 6, price: 550, pos: ["SG", "PG", "SF"], desc: "Deep shots fall more, and your green window holds up from range." },
  poster: { name: "Posterizer", short: "Poster", league: 5, price: 500, pos: ["SF", "PF", "C"], desc: "Bigger dunk radius; your dunks are 40% harder to stop." },
  lockdown: { name: "Lockdown Defender", short: "Lockdown", league: 5, price: 500, pos: ["SG", "SF", "PF"], desc: "Steal timing is more forgiving and your contests are 15% stronger." },
  boards: { name: "Rebound Chaser", short: "Boards", league: 3, price: 400, pos: ["PF", "C", "SF"], desc: "Grab rebounds from farther away." },
  clutch: { name: "Clutch", short: "Clutch", league: 6, price: 600, pos: ["PG", "SG", "SF", "PF", "C"], desc: "Bigger green window when the game is close late." },
};
const BADGE_ORDER = Object.keys(BADGES);
const hasBadge = (p, id) => !!(p && p.badges && p.badges.includes(id));
const badgeLabel = p => (p.badges || []).map(b => BADGES[b].short).join(", ");
// The ladder: what every player gets at each level (you, your opponents by their league, shop players by yours).
// HS / Hustle / Rec: main archetype only. Minor: 1st attribute. Semi-Pro: secondary archetype. Pro: 2nd attribute (better ones).
// Throne: elite attributes, main archetype maxes out. Olympics: a third archetype.
const LADDER = [
  { slots: 0, league: 0, sec: false, third: false, mainMax: 2 },   // High School
  { slots: 0, league: 1, sec: false, third: false, mainMax: 2 },   // Hustle League
  { slots: 0, league: 2, sec: false, third: false, mainMax: 3 },   // Rec League
  { slots: 1, league: 3, sec: false, third: false, mainMax: 3 },   // Minor League
  { slots: 1, league: 4, sec: true, third: false, mainMax: 4 },    // Semi-Pro
  { slots: 2, league: 5, sec: true, third: false, mainMax: 4 },    // Pro League
  { slots: 2, league: 6, sec: true, third: false, mainMax: 5 },    // The Throne
  { slots: 2, league: 7, sec: true, third: true, mainMax: 5 },     // The Olympics
];
const inLeague = t => { const n = TIERS[t].name; return n.startsWith("The ") || n === "Semi-Pro" ? n : `the ${n}`; };   // "in the Pro League", "in Semi-Pro"
const rungOf = tier => LADDER[clamp(tier || 0, 0, LADDER.length - 1)];
const badgeOpenAt = (id, tier) => BADGES[id].league <= rungOf(tier).league && rungOf(tier).slots > 0;
const nextRung = (tier, f) => { for (let t = tier + 1; t < LADDER.length; t++) if (f(LADDER[t], t)) return t; return null; };
// A player as their league allows: no secondary before Semi-Pro, a third at the Olympics, main level capped
function ladderize(p, tier, rng = null) {
  const L = rungOf(tier);
  if (p.mainLvl > L.mainMax) p.mainLvl = L.mainMax;
  if (!L.sec && p.sec) { p.sec = null; p.secLvl = 0; }
  if (L.third && !p.third && p.sec) { rng = rng || new Rng(`third|${p.name}|${p.number}`); p.third = rng.choice(ATTR_ORDER.filter(a => a !== p.main && a !== p.sec)); p.thirdLvl = rng.randint(1, S.SEC_MAX); }
  if (!L.third && p.third) { p.third = null; p.thirdLvl = 0; }
  return p;
}
// Keep a player's attributes within what their league allows (the rest wait until they're allowed again)
function fitBadges(p, tier, slots = rungOf(tier).slots) {
  const all = [...new Set([...(p.badges || []), ...(p.badgesHeld || [])])];
  p.badges = all.filter(b => badgeOpenAt(b, tier)).slice(0, slots);
  p.badgesHeld = all.filter(b => !p.badges.includes(b));
  return p;
}
// OVR milestones for your player: stamina, new moves, crew slots, cash and fame (attributes come from your league)
const MILESTONES = [
  { ovr: 45, stamina: true }, { ovr: 48 }, { ovr: 50 }, { ovr: 52, move: "spin" },
  { ovr: 55, stamina: true }, { ovr: 56, crew: true }, { ovr: 58 }, { ovr: 60, move: "behind" },
  { ovr: 62 }, { ovr: 65, stamina: true }, { ovr: 68 }, { ovr: 70 }, { ovr: 72 }, { ovr: 75, stamina: true, crew: true },
  { ovr: 80 }, { ovr: 82 }, { ovr: 85 }, { ovr: 90 },
];
const MOVE_NAMES = { spin: "Spin move", behind: "Behind-the-back" };
const milestoneText = ms => [ms.badge && BADGES[ms.badge].name, ms.slot && "+1 attribute slot", ms.move && MOVE_NAMES[ms.move], ms.stamina && "+stamina", ms.crew && "+1 crew slot"].filter(Boolean).join(" · ") || "cash & fame";
// Opponents and generated players: the better they are, the more attributes (and moves) they have
function tierForOvr(o) { let t = 0; for (let i = 0; i < TIERS.length; i++) if (TIERS[i].base <= o + 2) t = i; return t; }
function giveBadges(p, tier = null) {
  if (p.badges) return p;
  const o = overall(p); tier = tier ?? tierForOvr(o);
  const n = rungOf(tier).slots, rng = new Rng(`badge|${p.name}|${p.number}|${p.pos}`);
  let pool = BADGE_ORDER.filter(b => badgeOpenAt(b, tier) && BADGES[b].pos.includes(p.pos || "SF"));
  if (pool.length < n) pool = BADGE_ORDER.filter(b => badgeOpenAt(b, tier)); p.badges = [];
  while (p.badges.length < n && pool.length) p.badges.push(pool.splice(rng.randint(0, pool.length - 1), 1)[0]);
  p.moves = o >= 70 ? ["spin", "behind"] : o >= 60 ? ["spin"] : [];
  return p;
}
function attrLabel(p) {
  const parts = [];
  if (p.main && p.mainLvl) parts.push(`${ATTRS[p.main].name} ${p.mainLvl}`);
  if (p.sec && p.secLvl) parts.push(`${ATTRS[p.sec].name} ${p.secLvl} (2nd)`);
  if (p.third && p.thirdLvl) parts.push(`${ATTRS[p.third].name} ${p.thirdLvl} (3rd)`);
  return parts.join(" / ") || "No archetype";
}

// =====================================================================
// Players
// =====================================================================
function makePlayer(name, number, stats, main = null, mainLvl = 0, sec = null, secLvl = 0) {
  return { name, number, stats: { ...stats }, main, mainLvl, sec, secLvl };
}
const copyPlayer = p => JSON.parse(JSON.stringify(p));
function overall(p) {
  const avg = S.STATS.reduce((a, s) => a + p.stats[s], 0) / S.STATS.length;
  return Math.min(99, Math.round(avg + 2 * p.mainLvl + p.secLvl + (p.thirdLvl || 0)));
}
const teamOverall = ps => Math.round(ps.reduce((a, p) => a + overall(p), 0) / ps.length);

// =====================================================================
// Ball
// =====================================================================
class Ball {
  constructor() { this.state = "held"; this.holder = null; this.x = this.y = this.z = 0; this.vx = this.vy = 0; this.checked = new Set(); this.graceDelay = 0; }
  setHeld(a) { this.state = "held"; this.holder = a; this.passer = this.receiver = null; this.z = 0; this.follow(); }
  follow() { const a = this.holder; this.x = a.x + a.fx * 12; this.y = a.y + a.fy * 12; }
  startPass(from, to, speed) { this.state = "pass"; this.holder = null; this.passer = from; this.receiver = to; this.speed = speed; this.checked = new Set(); this.z = 8; }
  updatePass(dt) {
    const tx = this.receiver.x, ty = this.receiver.y, d = dist([this.x, this.y], [tx, ty]), step = this.speed * dt;
    if (d <= step) { this.x = tx; this.y = ty; } else { this.x += (tx - this.x) / d * step; this.y += (ty - this.y) / d * step; }
  }
  startShot(shooter, target, dur, made, points, dunk) {
    Object.assign(this, { state: "shot", holder: null, shooter, sx: shooter.x, sy: shooter.y, tx: target[0], ty: target[1], t: 0, dur, made, points, dunk });
    this.peak = dunk ? 12 : 40 + dist([this.sx, this.sy], target) * 0.25;
  }
  updateShot(dt) {
    this.t += dt; const f = Math.min(1, this.t / this.dur);
    this.x = this.sx + (this.tx - this.sx) * f; this.y = this.sy + (this.ty - this.sy) * f;
    this.z = Math.sin(Math.PI * f) * this.peak + 20 * f;
    return f >= 1;
  }
  setLoose(x, y, vx, vy, z = 20, delay = 0.15, vz = 0) { this.victim = null; Object.assign(this, { state: "loose", holder: null, passer: null, receiver: null, x, y, z, vx, vy, vz, grabDelay: delay, rimmed: false }); }
  updateLoose(dt) {
    this.grabDelay = Math.max(0, this.grabDelay - dt);
    this.x += this.vx * dt; this.y += this.vy * dt;
    const drag = Math.max(0, 1 - 2.2 * dt); this.vx *= drag; this.vy *= drag;
    this.vz = (this.vz || 0) - 700 * dt; this.z += this.vz * dt;
    if (this.z <= 0) { this.z = 0; this.vz = Math.abs(this.vz) > 70 ? -this.vz * 0.45 : 0; }   // bounce, losing energy
    const pad = 8;
    if (this.x < S.CL + pad || this.x > S.CR - pad) this.vx = -this.vx;
    if (this.y < S.CT + pad || this.y > S.CB - pad) this.vy = -this.vy;
    this.x = clamp(this.x, S.CL + pad, S.CR - pad); this.y = clamp(this.y, S.CT + pad, S.CB - pad);
  }
  setDead(x, y) { this.state = "dead"; this.holder = null; this.x = x; this.y = y; this.z = 0; }
  // a made basket: remember how it went in, for the finish animation
  setMade(x, y, how, at) { this.setDead(x, y); this.how = how; this.madeAt = at; this.side = Math.random() < 0.5 ? -1 : 1; }
}

// =====================================================================
// Match rules (same as game/match.py)
// =====================================================================
class Actor {
  constructor(p, team, slot) {
    Object.assign(this, { p, team, slot, x: 0, y: 0, vx: 0, vy: 0, dash: null, plant: 0, moveTag: null, stepBackT: 0, sprinting: false, stamina: 1, energy: 1, streak: 0, bounces: 0, fx: 0, fy: -1, stun: 0, cool: 0, burst: 0, jump: 0, points: 0, think: 0, spot: null, spotT: 0, holdT: 0 });
    // animation only (never affects the rules)
    const h = hashStr(p.name + p.number);
    this.look = makeLook(p); physOf(p);
    this.anim = null; this.runPhase = 0; this.moveAmt = 0; this.hand = 1; this.dribble = (h % 100) / 10;
  }
  setAnim(kind, dur) { this.anim = { kind, t: 0, dur }; }
  animK(kind) { return this.anim && this.anim.kind === kind ? this.anim.t / this.anim.dur : -1; }
  get pos() { return [this.x, this.y]; }
  eff(k) { return effect(this.p, k); }
  baseSpeed() { return (S.BASE_SPEED + this.p.stats.speed * S.SPEED_PER) * (1 + this.eff("speed")); }
  maxSpeed() {   // heavier = a touch slower
    let s = this.baseSpeed() * (this.hurt ? 0.7 : 1) * (1 - ((this.p.wt || 215) - 215) / 2500) * (this.gassed ? 0.88 : 1);   // worn out = slower
    if (this.sprinting && this.stamina > 0.02) s *= S.SPRINT; if (this.burst > 0) s *= 1.2; return s;
  }
  get onFire() { return this.streak >= 2; }
  get gassed() { return this.energy < S.GASSED; }
}
const MOVE_LABEL = { cross: "crossover", drive: "cross & drive", stepback: "step-back", sidestep: "step-back", go: "hesi-go", hesi: "hesi" };
function toward2(a, pt) { const dx = pt[0] - a.x, dy = pt[1] - a.y, d = Math.hypot(dx, dy); return d < 4 ? [0, 0] : [dx / d * Math.min(1, d / 14), dy / d * Math.min(1, d / 14)]; }

// ---------------------------------------------------------------- hub
class HubScreen extends Screen {
  constructor() {
    super();
    const c = this.c;
    // rows of tiles: [Play] [Crew, Train, Attributes] [Market, Mystery, Luck] [Quit]
    this.rows = [
      [{ id: "play", go: () => App.switch(new CourtScreen()) }, { id: "side", go: () => this.sideHustle() }],
      [{ id: "crew", name: "Crew", go: () => App.switch(this.c.stage === "pro" && this.c.tier === HUSTLE ? new GymScreen("view") : new CrewScreen()) },
       { id: "train", name: "Progress", go: () => App.switch(new TrainScreen()) },
       { id: "attr", name: "Attributes", go: () => this.open(() => new AttributesScreen()) }],
      [{ id: "market", name: "Player Market", go: () => this.shop(() => new MarketScreen()) },
       { id: "mystery", name: "Mystery Baller", go: () => this.shop(() => new MysteryScreen()) },
       { id: "luck", name: "Card Machines", go: () => this.shop(() => new SlotScreen()) }],
      [{ id: "quit", go: () => { App.save(); App.switch(new TitleScreen()); } }],
    ];
    this.r = 0; this.col = 0;
  }
  shop(make) { if (this.c.shopClosed) { this.msg = "No shop in the Hustle League."; this.msgT = 2.5; return; } this.open(make); }
  open(make) { if (this.c.locked) { this.msg = "Locked until high school is over. Go play!"; this.msgT = 2.5; return; } App.switch(make()); }
  key(k) {
    const rows = this.rows;
    if ((k === "b" || k === "B") && this.c.lastTourney && this.c.lastTourney.field) { App.switch(new BracketScreen(new HubScreen())); return; }
    if (K.up(k)) { this.r = (this.r - 1 + rows.length) % rows.length; if (this.c.shopClosed && this.r === 2) this.r = 1; }
    else if (K.down(k)) { this.r = (this.r + 1) % rows.length; if (this.c.shopClosed && this.r === 2) this.r = 3; }
    else if (K.left(k)) this.col = Math.max(0, this.col - 1);
    else if (K.right(k)) this.col = Math.min(2, this.col + 1);
    else if (K.ok(k)) { const row = rows[this.r]; row[Math.min(this.col, row.length - 1)].go(); }
  }
  sideHustle() {
    if (this.c.stage !== "pro" || this.c.tier <= HUSTLE) { this.msg = "Side hustles open up once you're past the Hustle League."; this.msgT = 2.5; return; }

// Draw text that shrinks until it fits a width.
function fitText(str, x, y, maxW, size, color) {
  let sz = size;
  while (sz > 12) { ctx.font = `500 ${Math.round(sz * 0.72)}px ${FONT_BODY}`; if (ctx.measureText(str).width <= maxW) break; sz -= 1; }
  text(str, x, y, { size: sz, color, weight: 500 });
}
// Fame toward the next level, with the line you get sent down under

class CourtScreen extends Screen {
  constructor() { super(); this.ci = this.c.tier; this.sel = 0; this.msg = ""; }

  options() {

      out.push({ kind: "tourney", game: g });
    }
    if (c.stage !== "hs") for (const crew of c.crewsFor(this.ci)) out.push({ kind: "pickup", game: crew });   // no pickup games in high school
    return out;
  }
  pick(i) {
    const c = this.c, o = this.options()[i]; this.sel = i;
    if (!o) return;
    if (o.kind === "tourney" && this.ci === HUSTLE && !o.game) { App.switch(new GymScreen("classic")); return; }   // pick who runs with you first
    if (o.kind === "pickup" && this.ci === HUSTLE && c.stage === "pro") { App.switch(new GymScreen("run", o.game)); return; }   // public gym: pick 2 from who's here today

// High school games go straight to tip-off (no betting); everything else offers a side bet first.
function startGame(ci, game) {
  const tourneyNoBet = game.mode === "tourney" && ci !== HUSTLE;   // tournaments pay prize money, no side bets (except the broke Hustle League)
  if (App.career.stage === "hs" || !BET_CAP[ci] || tourneyNoBet) App.switch(new MatchScreen(ci, game, 0, 1));   // no bets in high school or at the Olympics
  else App.switch(new WagerScreen(ci, game));
}

class WagerScreen extends Screen {
  constructor(ci, crew) {
    super(); this.ci = ci; this.crew = crew;
    const cash = this.c.cash;
    this.cap = BET_CAP[ci] || 0;
    this.bets = [0, ...BET_STEPS.filter(b => b <= Math.min(cash, this.cap))];
    if (cash > 0 && cash < this.cap && !this.bets.includes(cash)) this.bets.push(cash);   // all in
    this.i = 0; this.mine = this.c.lineupFor(crew); this.mult = Luck.wagerMult(teamOverall(this.mine), crew.ovr);
  }
  go() { const bet = this.bets[this.i]; if (Luck.placeBet(this.c, bet)) { App.save(); App.switch(new MatchScreen(this.ci, this.crew, bet, this.mult)); } }
  key(k) {
    if (K.back(k)) App.switch(new CourtScreen());
    else if (K.left(k)) this.i = Math.max(0, this.i - 1);
    else if (K.right(k)) this.i = Math.min(this.bets.length - 1, this.i + 1);
    else if (K.ok(k)) this.go();
  }
  draw() {
    this.header("Side Bet?"); this.backButton(() => App.switch(new CourtScreen()));
    const c = this.c, bet = this.bets[this.i];
    text(`Your crew OVR ${teamOverall(this.mine)}   vs   ${this.crew.name} OVR ${this.crew.ovr}`, 500, 190, { size: 34, center: true });
    const gap = this.crew.ovr - teamOverall(this.mine);
    text(gap > 0 ? `They're ${gap} OVR better than you, so a win pays ${this.mult}x your bet.` : gap < 0 ? `You're ${-gap} OVR better, so a win only pays ${this.mult}x.` : `Even matchup: a win pays ${this.mult}x.`,
      500, 234, { size: 27, color: gap > 0 ? C.gold : C.grey, center: true, weight: 500 });
    text("Tougher opponents pay more. Lose and the bet is gone.", 500, 262, { size: 22, color: C.grey, center: true, weight: 500 });

  else if (metering) { crouch = 3; L = [-5, -52]; R = [5, -53]; ball = [0, -57, 0]; }

// A pixel head-and-shoulders portrait of a player (for the shop and Mystery Baller cards)
// drawn at twice the in-game detail and cropped to the head and shoulders so the face reads
const portCanvas = document.createElement("canvas"); portCanvas.width = 38; portCanvas.height = 36;
const portCtx = portCanvas.getContext("2d", { willReadFrequently: true });
function drawPortrait(p, x, y, scale, team = 0) {
  const look = makeLook(p), g = portCtx;
  const P = { lift: 0, crouch: 0, lean: 0, L: [-11, -22], R: [11, -22], ball: null, stance: false, swing: 0, dir: 0 };
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 38, 36);
  g.translate(19, 61);   // head centre (-47) lands near the top third
  drawBody(g, P, { p }, look, team, true, false, false);
  pixelate(g, 38, 36);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(portCanvas, x, y, 38 * scale, 36 * scale);
  ctx.imageSmoothingEnabled = true;
}
function drawPerson(m, a, highlight) {
  const P = pose(m, a), look = a.look, team = a.team;
  const up = P.lift * 24, x = a.x, y = a.y;
  const front = a.fy > -0.2;          // facing the camera (down the screen) shows the face
  if (a.onFire) {   // the floor burns under a player who's on fire (the flames are particles, see MatchScreen)
    const fl = 0.75 + 0.25 * Math.sin(m.elapsed * 23 + x), g = ctx.createRadialGradient(x, y + 1, 2, x, y + 1, 30);
    g.addColorStop(0, `rgba(255,220,120,${0.55 * fl})`); g.addColorStop(0.45, `rgba(255,110,30,${0.35 * fl})`); g.addColorStop(1, "rgba(255,60,0,0)");
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y + 1, 30, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  if (a.dash) { for (let i = 1; i <= 3; i++) ellipse(x - a.dash.vx * 0.018 * i, y - a.dash.vy * 0.018 * i + 1, 10 - i * 2, 4 - i * 0.8, `rgba(255,255,255,${0.16 - i * 0.04})`); }
  const ghosts = a.trail && a.trail.length > 1 ? a.trail : null;   // dribble moves leave after-images
  // shadow on the court
  ellipse(x, y + 1, 13 - P.lift * 3, 5 - P.lift, `rgba(0,0,0,${0.45 - P.lift * 0.15})`);
  const isMain = team === 0 && a.slot === 0;
  if (isMain) ellipse(x, y + 1, 17, 7, null, C.gold, 2.5);
  if (highlight) { const pulse = 1.5 + 1.5 * Math.sin(m.elapsed * 8); ellipse(x, y + 1, 20 + pulse, 9 + pulse / 2, null, "rgba(255,255,255,0.9)", 2); }

  // the body is a pixel sprite: drawn small, snapped to hard pixels with an outline, then scaled up
  const sz = bodyScale(a.p), g = sprCtx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, SPR.W, SPR.H);
  g.translate(SPR.OX, SPR.OY); g.scale(sz / PX, sz / PX);
  if (a.stun > 0 && a.fallDir) {   // ankles broken: tips over fast, lands, scrambles back up
    const T = a.stunMax || 0.6, gone = T - a.stun, down = Math.min(1, gone / 0.16), up = Math.min(1, a.stun / 0.22);
    const k = Math.min(1 - Math.pow(1 - down, 3), up), wob = down >= 1 && up >= 1 ? Math.sin(m.elapsed * 30) * 0.05 : 0;
    g.rotate(a.fallDir * (1.25 * k + wob));
  } else if (a.stun > 0) g.rotate(Math.sin(m.elapsed * 24) * 0.18);
  else if (P.lean) g.transform(1, 0, -P.lean / 40, 1, 0, 0);   // lean into the move
  drawBody(g, P, a, look, team, front, a.stun > 0, !!(a.anim && a.anim.kind === "celebrate"));
  pixelate(g);
  ctx.imageSmoothingEnabled = false;
  const spin = a.anim && ((a.anim.kind === "dunk" && a.dunkStyle === "360") || a.anim.kind === "spin") ? Math.cos(a.anim.t / a.anim.dur * Math.PI * 2) : 1;   // 360 dunk / spin move: turns all the way around
  if (ghosts) {

      ctx.drawImage(sprCanvas, Math.round(q.x - SPR.OX * PX), Math.round(q.y - up + P.crouch - SPR.OY * PX), SPR.W * PX, SPR.H * PX); }
    ctx.globalAlpha = 1;
    const o = ghosts[0]; ctx.strokeStyle = team === 0 ? "rgba(120,190,255,0.55)" : "rgba(255,140,130,0.55)"; ctx.lineWidth = 3; ctx.lineCap = "round";   // speed streak at the waist
    ctx.beginPath(); ctx.moveTo(o.x, o.y - 22 - up); ctx.lineTo(x, y - 22 - up); ctx.stroke();

  if (spin !== 1) { ctx.save(); ctx.translate(x, 0); ctx.scale(Math.abs(spin) < 0.12 ? 0.12 * Math.sign(spin || 1) : spin, 1); ctx.translate(-x, 0); }
  ctx.drawImage(sprCanvas, Math.round(x - SPR.OX * PX), Math.round(y - up + P.crouch - SPR.OY * PX), SPR.W * PX, SPR.H * PX);
  if (spin !== 1) ctx.restore();
  ctx.imageSmoothingEnabled = true;

  if (a.stun > 0 && a.fallDir) {   // ankles broken: stars spin around the head
    for (let i = 0; i < 3; i++) { const t = m.elapsed * 6 + i * 2.1; text("✦", x + Math.cos(t) * 12, y - 58 + Math.sin(t) * 4, { size: 18, color: C.gold, center: true }); }
  }

    ctx.beginPath(); ctx.moveTo(x - 7, ty); ctx.lineTo(x + 7, ty); ctx.lineTo(x, ty + 9); ctx.closePath(); ctx.fillStyle = C.gold; ctx.fill();

    ctx.globalAlpha = 1;
  }

}

// x, y = spot on the court under the ball; h = height above the court in pixels
function drawBall(x, y, h, t, r = 6.5, spin = 6) {
  r *= 1.2;   // a touch bigger so it reads on every floor
  ellipse(x, y + 1, r * 0.95, r * 0.45, `rgba(0,0,0,${Math.max(0.2, 0.55 - h / 200)})`);
  const by = y - h, rr = r * (1 + Math.max(0, h - 30) / 260);   // closer to the camera = bigger
  circle(x, by, rr + 2.5, "rgba(255,255,255,0.3)");               // light halo
  const bg = ctx.createRadialGradient(x - rr * 0.4, by - rr * 0.45, rr * 0.1, x, by, rr);   // round, lit from the top left
  bg.addColorStop(0, "#ffb15a"); bg.addColorStop(0.55, "#ec6e14"); bg.addColorStop(1, "#a7480a");
  circle(x, by, rr, bg, "#1a0c02", 2);                             // dark outline
  ctx.save(); ctx.beginPath(); ctx.arc(x, by, rr - 0.5, 0, Math.PI * 2); ctx.clip(); ctx.translate(x, by); ctx.rotate(t * spin);
  ctx.strokeStyle = "#2a1205"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, -rr); ctx.lineTo(0, rr); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-rr, 0); ctx.lineTo(rr, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(-rr * 1.2, 0, rr * 0.95, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(rr * 1.2, 0, rr * 0.95, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  ctx.restore();
  circle(x - rr * 0.35, by - rr * 0.35, rr * 0.3, "rgba(255,255,255,0.2)");
}

// How a made basket looks: swishes drop through the net, rim-ins roll around first, dunks get slammed.
function drawFinish(m, b) {
  const [hx, hy] = S.HOOP, t = m.elapsed - (b.madeAt || 0);
  const hop = (u, v0) => { // small bounces on the floor after dropping through
    let h = 0, v = v0, tt = u;
    for (let i = 0; i < 3 && tt > 0; i++) { const air = 2 * v / 900; if (tt < air) { h = v * tt - 450 * tt * tt; break; } tt -= air; v *= 0.45; }
    return Math.max(0, h);
  };
  let x = hx, y = hy, h = 0, r = 6.5;
  if (b.how === "rim" && t < 0.36) {          // rattles around the rim first
    const a = t * 20 * b.side; x = hx + Math.cos(a) * 10; y = hy + Math.sin(a) * 6;
  } else {
    const u = Math.max(0, t - (b.how === "rim" ? 0.36 : 0));
    const through = Math.min(1, u / 0.14);    // sinking through the net
    y = hy + through * 16; r = 6.5 - through * 1.2 + (u > 0.14 ? 1.2 : 0);
    h = u > 0.14 ? hop(u - 0.14, b.how === "dunk" ? 230 : 150) : 0;
  }
  drawBall(x, y, h, m.elapsed, r, 3);
}

function drawRimFx(m) {   // the hoop on top of the players (they run under it), shaking and rippling
  const [hx, hy] = S.HOOP, sh = m.fx.shake;
  drawHoop(hx, hy, sh > 0 ? Math.sin(m.elapsed * 70) * 3 * (sh / 0.45) : 0, m.fx.swish);
}

function drawActors(m, controlled) {
  const b = m.ball;
  // players nearer the bottom of the screen are drawn last so overlaps look right
  const order = [...m.actors].sort((p, q) => p.y - q.y);
  let held = null;
  let dunkHand = null;
  for (const a of order) {
    const hb = drawPerson(m, a, controlled && a === m.controlled);
    if (hb) { if (b.state === "shot" && b.dunk && a === b.shooter) dunkHand = hb; else held = hb; }
  }
  drawRimFx(m);
  if (b.state === "held" && held) drawBall(held.x, b.holder.y, b.holder.y - held.y, m.elapsed);
  else if (b.state === "shot" && b.dunk && dunkHand) drawBall(dunkHand.x, b.shooter.y, b.shooter.y - dunkHand.y, m.elapsed, 6.5, 4);
  else if (b.state === "shot") {
    const f = Math.min(1, b.t / b.dur), h = 50 * (1 - f) + Math.sin(Math.PI * f) * b.peak * 0.9;   // from the hands, up, and down into the rim
    b.trail = b.trail || []; b.trail.push([b.x, b.y - h]); if (b.trail.length > 12) b.trail.shift();
    const col = b.fire ? "255,120,30" : b.green ? "255,215,80" : "255,255,255";
    if (b.green || b.fire) {   // a glowing comet tail
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
      const cc = b.green ? "125,255,154" : "255,140,40";
      for (let i = 1; i < b.trail.length; i++) { const k = i / b.trail.length; ctx.strokeStyle = `rgba(${cc},${k * 0.7})`; ctx.lineWidth = 2 + k * 11; ctx.beginPath(); ctx.moveTo(b.trail[i - 1][0], b.trail[i - 1][1]); ctx.lineTo(b.trail[i][0], b.trail[i][1]); ctx.stroke(); }
      for (let i = 1; i < b.trail.length; i++) { const k = i / b.trail.length; ctx.strokeStyle = `rgba(255,255,255,${k * 0.6})`; ctx.lineWidth = 1 + k * 3; ctx.beginPath(); ctx.moveTo(b.trail[i - 1][0], b.trail[i - 1][1]); ctx.lineTo(b.trail[i][0], b.trail[i][1]); ctx.stroke(); }
      ctx.restore();
    } else b.trail.forEach(([tx, ty], i) => circle(tx, ty, 2 + i * 0.35, `rgba(${col},${(i / b.trail.length) * 0.2})`));
    if (b.green || b.fire) circle(b.x, b.y - h, 13, `rgba(${col},0.25)`);

}

// Fans stand along the fences. More fame = more people show up.
function makeCrowd(size, seed, split = false) {
  const rng = new Rng(seed), slots = [];
  for (const side of [-1, 1]) for (let row = 0; row < 3; row++) for (let y = 96; y <= 640; y += 25) {
    const x = side < 0 ? 58 - row * 22 : 942 + row * 22;
    slots.push({ x: x + rng.uniform(-3, 3), y: y + row * 8 + rng.uniform(-3, 3), side, rank: row * 1000 + Math.abs(y - 360) + rng.uniform(0, 60) });
  }
  slots.sort((p, q) => p.rank - q.rank);
  const ours = ["#3c82eb", "#2f6ccf", "#dfe9ff", "#3c82eb"], theirs = ["#d7413c", "#b52f2b", "#ffe2dc", "#d7413c"];
  const anyShirt = ["#e04a3a", "#2f7de0", "#f5c83c", "#3ecf7a", "#f2f2f2", "#9b59b6", "#ff8a3d", "#222"];
  return slots.slice(0, size).map(sl => ({ ...sl, home: split && sl.side > 0, skin: rng.choice(SKINS), shirt: rng.choice(split ? (sl.side < 0 ? ours : theirs) : anyShirt), hair: rng.choice(HAIRS), ph: rng.uniform(0, 6.28), hype: rng.uniform(0.6, 1.2) }))
    .sort((p, q) => p.y - q.y);
}
function drawCrowd(crowd, t, exciteOurs, exciteHome = exciteOurs) {
  for (const f of crowd) {
    const excite = f.home ? exciteHome : exciteOurs;
    const jump = Math.max(0, Math.sin(t * 9 * f.hype + f.ph)) * 7 * excite, bob = Math.sin(t * 2 + f.ph) * 0.8;
    const x = f.x, y = f.y - jump + bob;
    ellipse(f.x, f.y + 9, 6, 2.5, "rgba(0,0,0,0.35)");
    const arm = excite > 0.25 ? -16 : -4;
    ctx.strokeStyle = f.skin; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x - 5, y - 6); ctx.lineTo(x - 8, y + arm + Math.sin(t * 12 + f.ph) * 2 * excite); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 5, y - 6); ctx.lineTo(x + 8, y + arm + Math.cos(t * 12 + f.ph) * 2 * excite); ctx.stroke();
    ctx.fillStyle = f.shirt; ctx.beginPath(); ctx.roundRect(x - 5.5, y - 8, 11, 14, 3); ctx.fill();
    circle(x, y - 13, 4.8, f.skin); ctx.beginPath(); ctx.arc(x, y - 13, 4.8, Math.PI, 2 * Math.PI); ctx.fillStyle = f.hair; ctx.fill();
  }
}

// The scout: courtside, cap and clipboard, always writing.
function drawScout(x, y, t) {
  ellipse(x, y + 12, 8, 3, "rgba(0,0,0,0.4)");
  ctx.fillStyle = "#2b2f3a"; ctx.beginPath(); ctx.roundRect(x - 7, y - 10, 14, 20, 4); ctx.fill();
  ctx.strokeStyle = "#2b2f3a"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - 3, y + 8); ctx.lineTo(x - 3, y + 14); ctx.moveTo(x + 3, y + 8); ctx.lineTo(x + 3, y + 14); ctx.stroke();
  rrect(x + 3, y - 6, 10, 13, 2, "#c8a26b");                       // clipboard
  ctx.fillStyle = "#fff"; ctx.fillRect(x + 5, y - 4, 6, 8);
  const pen = Math.sin(t * 9) * 2;
  ctx.strokeStyle = "#1c1c1c"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + 8 + pen, y - 2); ctx.lineTo(x + 12 + pen, y - 8); ctx.stroke();
  circle(x, y - 16, 5.5, "#c68642");
  ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.arc(x, y - 17, 5.8, Math.PI, 2 * Math.PI); ctx.fill(); ctx.fillRect(x, y - 18, 8, 2.2);   // cap
  rrect(x - 26, y - 44, 52, 18, 5, "rgba(20,20,26,0.85)");
  text("SCOUT", x, y - 35, { size: 18, color: C.gold, center: true, display: true });

class MatchScreen extends Screen {
  constructor(ci, crew, bet = 0, mult = 1) {
    super(); Object.assign(this, { ci, crew, bet, mult, paused: false, doneT: 0 });
    this.scout = this.c.scouting();
    // high school: the whole school shows up, and half of them want you to lose
    this.hsGym = ci === 0;
    const pressure = this.hsGym ? 0.25 + 0.06 * Math.max(0, crew.round || 0) + (crew.series && crew.series.w + crew.series.l === 2 ? 0.1 : 0) : 0;   // game 3s are loud
    const mine = this.c.lineupFor(crew);
    const theirSub = settleOverall(generatePlayer(new Rng(crew.id + "|sub"), TIERS[ci].base, "SF"), Math.max(20, crew.ovr - 3));
    this.match = new Match(mine, crew.players, new Rng(), true, S.GAME_TO, {
      scout: this.scout, favMove: this.c.favoriteMove(), pressure,
      coach: ci === 0 || ci >= 3,                       // no coach in the Hustle or Rec League
      injuries: true, bench: { 0: this.c.benchFor(crew, mine), 1: [theirSub] },
      benchable: crew.mode === "tourney" && (ci === 0 || ci >= 3),   // the coach decides who plays in tournaments (not in pickup/hustle games)
    });
    this.crowdN = ci === HUSTLE ? 0 : this.hsGym ? 140 : this.c.crowdSize();
    this.crowd = makeCrowd(this.crowdN, crew.id + ":" + this.c.fame, this.hsGym);
    this.exciteHome = 0.15; this.booT = 3;
    this.scoutWatching = crew.mode === "tourney" && (this.c.stage === "hs" || (ci === HUSTLE && crew.round === FINAL_ROUND) || (ci === THRONE && this.c.tier === THRONE));
    // a writer drops in now and then (Rec League and up): they write you up after the game
    this.press = null;
    if (this.c.stage === "pro" && ci >= 2 && !this.scoutWatching && Math.random() < (crew.mode !== "tourney" ? 0.12 : crew.round === FINAL_ROUND ? 0.35 : 0.2)) {
      this.press = outletFor(ci, new Rng()); this.scoutWatching = true;
      this.match.say(`A writer from ${this.press} is in the stands tonight!`, 3.2);
    }
    this.endFx = false; this.parts = []; this.pops = []; this.rings = []; this.fxp = []; this.fx = []; this.scorePop = [0, 0]; this.rimFire = 0; this.hitstop = 0; this.zoom = null; this.slowmo = 0; this.vig = 0; this.white = 0; this.excite = 0.15; this.shake = 0; this.flash = 0; this.freeze = null; this.lastBounce = 0;
  }
  burst(x, y, n, colors, speed = 160, up = 60) {
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = speed * (0.4 + Math.random() * 0.8);
      this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - up, life: 0.6 + Math.random() * 0.5, max: 1.1, col: colors[i % colors.length], r: 2 + Math.random() * 2.5, g: 260 }); }
  }
  pop(txt, x, y, color, size = 40, life = 1.1) { this.pops.push({ txt, x, y, color, size, life, max: life }); }
  scoutNote(txt) { if (this.scoutWatching) this.pop(`Scout: ${txt}`, 220, 300 + (this.pops.length % 3) * 26, "#ffe9a8", 26, 1.8); }
  handleEvents() {
    const m = this.match, [hx, hy] = S.HOOP, crowd = this.crowdN;
    for (const e of m.events) {
      if (e.type === "release" && e.human && e.green) this.scoutNote("that's a green");
      if (e.type === "make" && e.team === 0 && e.kind === "dunk") this.scoutNote("explosive");
      if (e.type === "make" && e.team === 0 && e.newFire) this.scoutNote("can't miss");
      if (e.type === "ankles" && e.team === 0) this.scoutNote("nice handles");
      if (e.type === "steal" && e.team === 1) this.scoutNote("sloppy turnover");
      if (e.type === "release" && e.human) {
        const a = m.controlled;
        this.freeze = { t: 0.5, green: e.green };
        if (e.green) {   // green release: light beam, floor shockwave, green sparks, glowing edges, PERFECT on the meter
          Sound.green(); this.vig = 0.55; this.shake = Math.max(this.shake, 0.12);
          this.fx.push({ type: "beam", x: a.x, y: a.y, t: 0, dur: 0.75 }, { type: "shock", x: a.x, y: a.y + 1, t: 0, dur: 0.55, R: 80, col: "125,255,154" }, { type: "shock", x: a.x, y: a.y + 1, t: -0.12, dur: 0.55, R: 54, col: "230,255,235" });
          this.sparks(a.x, a.y - 50, 30, "125,255,154", 210, 0.8, "star");
          this.fx.push({ type: "stamp", text: "PERFECT", x: a.x + 44, y: a.y - 84, t: 0, dur: 0.75, size: 24, col: "#7dff9a" });
        }
      } else if (e.type === "make") {
        const mine = e.team === 0;
        this.rings.push({ t: 0, col: e.green ? "245,200,60" : e.kind === "dunk" ? "235,130,40" : "255,255,255" });
        if (e.green) {   // GREEN: rings, a fountain of sparks from the rim, a big glowing stamp, a beat of slow motion
          this.rings.push({ t: -0.12, col: "125,255,154" }, { t: -0.24, col: "230,255,235" });
          this.sparks(hx, hy, 46, "125,255,154", 260, 1.0, "star", -160); this.sparks(hx, hy, 20, "255,230,140", 200, 0.8, "spark", -120);
          this.fx.push({ type: "stamp", text: "GREEN!", x: hx, y: hy + 74, t: 0, dur: 1.15, size: 64, col: "#7dff9a" });
          this.vig = Math.max(this.vig, 0.6); this.slowmo = Math.max(this.slowmo, 0.22);
        }
        if (e.kind === "dunk") {   // the dunk: shake by style, shockwaves, dust, sparks, a stamp (and slow motion + flash for the big ones)
          const D = DUNK_STYLES[e.style] || DUNK_STYLES.two;
          Sound.dunk(); this.shake = Math.max(this.shake, D.shake); m.fx.shake = Math.max(m.fx.shake, 0.3 + D.shake * 0.5);

      you ? `rgba(245,200,60,${lost ? 0.5 : pulse})` : won ? "#4d5b82" : null, you ? 2 : 1);

// The Hustle gym: regulars rotate every day. Win with them and they start to like you.
class GymScreen extends Screen {
  // mode: "run" (pick 2 for a pickup game), "classic" (pick 3 for the Hustle Classic), "view" (just look around)
  constructor(mode = "view", game = null) {
    super(); this.c.ensureGym(); Object.assign(this, { mode: mode === true ? "classic" : mode || "view", game, i: 0, all: false });
    this.msg = this.mode === "classic" ? "Choose 3 players for the Hustle Classic: 2 starters and a sub." : this.mode === "run" ? "Pick 2 from who's in the gym today. The less they like you, the more likely they say no." : "";
  }
  get need() { return this.mode === "classic" ? 3 : 2; }
  get locked() { const t = this.c.tourney; return !!(t && t.tier === HUSTLE && t.roster); }
  list() { return this.all ? this.c.gym.map((g, i) => i) : this.locked && this.mode !== "run" ? this.c.tourney.roster : this.c.gymToday(); }
  back() { App.switch(this.mode === "view" ? new HubScreen() : new CourtScreen()); }
  ask(i) {
    if (this.mode === "view") { this.msg = "Pick teammates from the Play screen."; return; }
    if (this.locked && this.mode === "classic") { this.msg = "Your Classic team is locked in until the tournament ends."; return; }
    if (this.all) { this.msg = "Only people in the gym today can run with you."; return; }
    const [, msg] = this.c.askToRun(i, this.need); this.msg = msg; App.save();
  }
  go() {
    const c = this.c, A = c.asks, got = c.fillRandom(this.need);
    if (got.length) this.msg = `${A.picks.length - got.length ? "Nobody else wanted to run." : "Nobody wanted to run."} You got ${got.join(" & ")}.`;
    App.save();
    if (this.mode === "classic") { c.enterTourney(); App.save(); const go = () => App.switch(new BracketScreen(() => startGame(HUSTLE, c.tourneyGame()))); got.length ? (this.thenT = 1.4, this.then = go) : go(); }
    else { const go = () => startGame(HUSTLE, this.game); got.length ? (this.thenT = 1.4, this.then = go) : go(); }
  }
  update(dt) { if (this.then) { this.thenT -= dt; if (this.thenT <= 0) { const f = this.then; this.then = null; f(); } } }
  key(k) {
    if (this.then) return;
    const L = this.list(), n = L.length, half = Math.ceil(n / 2);
    if (K.back(k)) this.back();
    else if (K.up(k)) this.i = (this.i - 1 + n) % n;
    else if (K.down(k)) this.i = (this.i + 1) % n;
    else if (K.left(k) || K.right(k)) this.i = this.i >= half ? this.i - half : Math.min(n - 1, this.i + half);
    else if (k === "Tab") { this.all = !this.all; this.i = 0; }
    else if (K.ok(k)) this.ask(L[this.i]);
    else if ((k === "p" || k === "P" || k === "e" || k === "E") && this.mode !== "view") this.go();
  }
  draw() {
    const c = this.c, L = this.list(), A = c.asks, today = c.gymToday();

// ---- opening a card: the pack shakes and teases its color, bursts, then the card flips in
class PackReveal {
  constructor(label, p, opts = {}) {
    Object.assign(this, { label, p, t: 0, parts: [], ti: RAR_TIER[label] || 0, opts, beat: -1, done: false, burstDone: false });
    this.packT = opts.pack === false ? 0 : 1.0 + 0.45 * Math.max(0, this.ti - 1);   // rarer = a longer, tenser build-up
    this.end = this.packT + 1.7;
  }
  get color() { return rarColorName(this.label); }
  teaseColor() {   // the glow climbs the rarity ladder a step per beat until it reaches the real one
    const steps = ["Bum", "Solid", "Baller", "Legend", "Mythic", "Eternal"];
    const k = Math.min(this.ti, Math.floor(this.t / Math.max(0.3, this.packT / (this.ti + 1))));
    return k === 0 ? "#ffffff" : rarColorName(steps[k]);
  }
  skip() { if (this.t < this.end) { if (!this.burstDone) this.burst(); this.t = this.end; } }
  burst() {
    this.burstDone = true;
    const n = 30 + 25 * this.ti, cols = this.ti >= 5 ? ["#ff5a5a", "#ffd23c", "#5aff8a", "#5ad2ff", "#c78bff"] : [this.ti >= 4 ? "#ff3b5c" : RARITY[Math.min(5, this.ti)].color, "#ffffff", C.gold];
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = 120 + Math.random() * (260 + 60 * this.ti);
      this.parts.push({ x: 500, y: 330, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 1 + Math.random() * 1.2, max: 2.2, col: cols[i % cols.length], r: 2 + Math.random() * 3, g: 220 }); }
    try { if (this.ti >= 3) { Sound.dunk(); Sound.cheer(60 + 30 * this.ti, true); } else Sound.swish(); } catch (e) {}
  }
  confetti(dt) {   // Epic and up keep raining confetti
    if (this.ti < 2 || this.t < this.packT) return;
    const rate = (this.ti - 1) * 14 * dt;
    for (let i = 0; i < rate + (Math.random() < rate % 1 ? 1 : 0); i++) this.parts.push({ x: Math.random() * 1000, y: -10, vx: (Math.random() - 0.5) * 60, vy: 60 + Math.random() * 80, life: 4, max: 4, col: `hsl(${Math.random() * 360},90%,65%)`, r: 2.5 + Math.random() * 2, g: 30, conf: true });
  }
  update(dt) {
    const was = this.t; this.t = Math.min(this.t + dt, this.end + 999);
