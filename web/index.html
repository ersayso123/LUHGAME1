<title>Streetball Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;700&display=swap">
<style>
/* Layout: one 10:7 game canvas centered on a night-court ground, touch pad underneath on phones. Single dark look on purpose. */
:root {
  --ground: #101116;
  --panel: #1b1d25;
  --line: #3a3d4a;
  --ink: #eef0f2;
  --muted: #9296a3;
  --ball: #eb8228;
  --crown: #f5c83c;
  --display: "Bungee", Impact, "Arial Black", sans-serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  padding-inline: 16px;
  padding-block: 12px;
  box-sizing: border-box;
}
#wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
#stage { position: relative; width: 100%; aspect-ratio: 10 / 7; max-width: 100%; }
#game {
  width: 100%; height: 100%; display: block; border-radius: 10px;
  background: var(--panel); outline: none; touch-action: none;
}
#game:focus-visible { box-shadow: 0 0 0 3px var(--crown); }
#name-input {
  position: absolute; left: 30%; top: 26.4%; width: 40%; height: 7.2%;
  box-sizing: border-box; border: 2px solid var(--crown); border-radius: 6px;
  background: #282a34; color: var(--ink); text-align: center;
  font: 700 clamp(14px, 3.2vw, 30px) var(--body);
}
#hint { color: var(--muted); font-size: 14px; text-align: center; margin: 0; }
#pad { display: none; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; user-select: none; -webkit-user-select: none; }
#pad.show { display: grid; }
.dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
.pb {
  border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 10px; font: 700 15px var(--body); letter-spacing: .04em;
  touch-action: none; min-width: 52px; min-height: 52px;
}
.pb:active, .pb.on { background: #2c2f3b; border-color: var(--crown); }
.pb.big { background: var(--ball); color: #1a0f05; border-color: var(--ball); min-width: 84px; min-height: 84px; border-radius: 50%; font-size: 17px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.mid { display: flex; justify-content: center; }
@media (prefers-reduced-motion: reduce) { .pb { transition: none; } }
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="game" tabindex="0" aria-label="Streetball Kingdom game. Click to focus, then use the keyboard."></canvas>
    <input id="name-input" maxlength="14" placeholder="Type your name" autocomplete="off" hidden>
  </div>
  <p id="hint">Click the game, then play with the keyboard. On a phone, tap menus and use the buttons below.</p>
  <div id="pad" aria-label="Touch controls">
    <div class="dpad">
      <span></span><button class="pb" data-dir="up" aria-label="Up">▲</button><span></span>
      <button class="pb" data-dir="left" aria-label="Left">◀</button><span></span><button class="pb" data-dir="right" aria-label="Right">▶</button>
      <span></span><button class="pb" data-dir="down" aria-label="Down">▼</button><span></span>
    </div>
    <div class="mid"><button class="pb" id="b-pause">PAUSE</button></div>
    <div class="acts">
      <button class="pb" id="b-sprint">SPRINT</button>
      <button class="pb" id="b-switch">SWITCH</button>
      <button class="pb" id="b-move">MOVE / STEAL</button>
      <button class="pb" id="b-pass">PASS</button>
      <button class="pb big" id="b-shoot">SHOOT</button>
    </div>
  </div>
</div>

<script>
"use strict";
// =====================================================================
// Settings (same numbers as game/settings.py)
// =====================================================================
const S = {
  W: 1000, H: 700,
  CL: 100, CT: 60, CR: 900, CB: 640,
  HOOP: [500, 115], ARC: 250, PAINT_HW: 80, PAINT_D: 190, CHECK: [500, 450],
  GAME_TO: 11, SHOT_CLOCK: 10,
  PR: 14, BASE_SPEED: 165, SPEED_PER: 1.8, PASS_SPEED: 720, ACCEL: 11, SPRINT: 1.35, STAMINA_DRAIN: 0.42, STAMINA_REGEN: 0.22,
  METER_TIME: 0.7, METER_SWEET: 0.8, WIN_NEAR: 0.12, WIN_FAR: 0.04,
  DUNK_RANGE: 85, DUNK_BASE: 0.9, LAYUP: 95, LAYUP_BASE: 0.72,
  STEAL_RANGE: 36, STEAL_BASE: 0.16, BLOCK_RANGE: 36, BLOCK_BASE: 0.10, GRAB: 20,
  MAIN_MAX: 5, SEC_MAX: 3, SEC_PCT: 0.5, SEC_UNLOCK: 1,
  CREW_MAX: 6, STAT_MAX: 99, STAT_STEP: 2,
  STATS: ["shooting", "speed", "handles", "defense", "rebounding"],
  LABEL: { shooting: "Shooting", speed: "Speed", handles: "Handles", defense: "Defense", rebounding: "Rebounding" },
};
const C = {
  white: "#f0f0f0", grey: "#8c8c96", dark: "#1c1c22", gold: "#f5c83c", green: "#5ad26e",
  red: "#e15046", orange: "#eb8228", blue: "#5096f0", black: "#0f0f12",
  team: ["#3c82eb", "#d7413c"], bg: "#12141a", bar: "#1e202a",
};
const SAVE_KEY = "streetball-kingdom-v1";
// Player looks (picked from each player's name so they stay the same)
const SKINS = ["#8d5524", "#c68642", "#e0ac69", "#f1c27d", "#5c3a1e", "#a0673c", "#3d2314", "#ffdbac"];
const HAIRS = ["#1b1410", "#2e1d12", "#5a3a1c", "#0e0e0e", "#8a5a2b", "#d8b26a"];
const SHOES = ["#f2f2f2", "#141414", "#e04a3a", "#2f7de0", "#f5c83c", "#3ecf7a"];

// =====================================================================
// Random numbers (seedable so crews are the same every visit)
// =====================================================================
function hashStr(s) { let h = 2166136261 >>> 0; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
class Rng {
  constructor(seed) { this.s = typeof seed === "string" ? hashStr(seed) : (seed ?? Math.floor(Math.random() * 2 ** 32)) >>> 0; }
  random() { let t = (this.s += 0x6D2B79F5) >>> 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  uniform(a, b) { return a + (b - a) * this.random(); }
  randint(a, b) { return a + Math.floor(this.random() * (b - a + 1)); }
  choice(arr) { return arr[Math.floor(this.random() * arr.length)]; }
  choices(arr, w) { const tot = w.reduce((a, b) => a + b, 0); let r = this.random() * tot; for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r < 0) return arr[i]; } return arr[arr.length - 1]; }
  gauss(mu, sd) { const u = 1 - this.random(), v = this.random(); return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
}

// =====================================================================
// Geometry
// =====================================================================
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function norm(x, y) { const d = Math.hypot(x, y); return d > 1e-6 ? [x / d, y / d] : [0, 0]; }
const shotPoints = pos => dist(pos, S.HOOP) > S.ARC ? 2 : 1;
const beyondArc = (pos, m = 0) => dist(pos, S.HOOP) > S.ARC + m;
const clampCourt = (x, y, pad = S.PR) => [clamp(x, S.CL + pad, S.CR - pad), clamp(y, S.CT + pad, S.CB - pad)];

// =====================================================================
// Attributes: Main gets full effect (max 5), Secondary gets SEC_PCT (max 3)
// =====================================================================
const ATTRS = {
  sharpshooter: { name: "Sharpshooter", desc: "Better from behind the arc and a wider green zone on the shot meter.", fx: { deep: 0.035, meter: 0.012 } },
  dunker: { name: "Dunker", desc: "Shoot near the rim to dunk. Dunks are hard to block and go in more.", fx: { dunk: 0.05, finish: 0.02 } },
  lockdown: { name: "Lockdown", desc: "Steals work more often and the shooters you guard miss more.", fx: { steal: 0.035, contest: 0.03 } },
  glass: { name: "Glass Cleaner", desc: "Win more rebounds and grab them from farther away.", fx: { rebound: 0.15, reach: 3 } },
  playmaker: { name: "Playmaker", desc: "Faster passes that get picked off less, and crossovers that break ankles.", fx: { pass: 0.08, cross: 0.05 } },
  speedster: { name: "Speedster", desc: "Higher top speed on both ends of the court.", fx: { speed: 0.035 } },
};
const ATTR_ORDER = Object.keys(ATTRS);
const MAIN_COSTS = [100, 150, 300, 550, 900];
const SEC_COSTS = [200, 400, 700];
const maxLevel = slot => slot === "main" ? S.MAIN_MAX : S.SEC_MAX;
function upgradeCost(slot, lvl) { const c = slot === "main" ? MAIN_COSTS : SEC_COSTS; return lvl >= c.length ? null : c[lvl]; }
function effect(p, key) {
  let t = 0;
  if (p.main) t += (ATTRS[p.main].fx[key] || 0) * p.mainLvl;
  if (p.sec) t += (ATTRS[p.sec].fx[key] || 0) * p.secLvl * S.SEC_PCT;
  return t;
}
const canDunk = p => (p.main === "dunker" && p.mainLvl > 0) || (p.sec === "dunker" && p.secLvl > 0);
function attrLabel(p) {
  const parts = [];
  if (p.main && p.mainLvl) parts.push(`${ATTRS[p.main].name} ${p.mainLvl}`);
  if (p.sec && p.secLvl) parts.push(`${ATTRS[p.sec].name} ${p.secLvl} (2nd)`);
  return parts.join(" / ") || "No attributes";
}

// =====================================================================
// Players
// =====================================================================
function makePlayer(name, number, stats, main = null, mainLvl = 0, sec = null, secLvl = 0) {
  return { name, number, stats: { ...stats }, main, mainLvl, sec, secLvl };
}
const copyPlayer = p => JSON.parse(JSON.stringify(p));
function overall(p) {
  const avg = S.STATS.reduce((a, s) => a + p.stats[s], 0) / S.STATS.length;
  return Math.min(99, Math.round(avg + 2 * p.mainLvl + p.secLvl));
}
const teamOverall = ps => Math.round(ps.reduce((a, p) => a + overall(p), 0) / ps.length);

// =====================================================================
// Ball
// =====================================================================
class Ball {
  constructor() { this.state = "held"; this.holder = null; this.x = this.y = this.z = 0; this.vx = this.vy = 0; this.checked = new Set(); this.graceDelay = 0; }
  setHeld(a) { this.state = "held"; this.holder = a; this.passer = this.receiver = null; this.z = 0; this.follow(); }
  follow() { const a = this.holder; this.x = a.x + a.fx * 12; this.y = a.y + a.fy * 12; }
  startPass(from, to, speed) { this.state = "pass"; this.holder = null; this.passer = from; this.receiver = to; this.speed = speed; this.checked = new Set(); this.z = 8; }
  updatePass(dt) {
    const tx = this.receiver.x, ty = this.receiver.y, d = dist([this.x, this.y], [tx, ty]), step = this.speed * dt;
    if (d <= step) { this.x = tx; this.y = ty; } else { this.x += (tx - this.x) / d * step; this.y += (ty - this.y) / d * step; }
  }
  startShot(shooter, target, dur, made, points, dunk) {
    Object.assign(this, { state: "shot", holder: null, shooter, sx: shooter.x, sy: shooter.y, tx: target[0], ty: target[1], t: 0, dur, made, points, dunk });
    this.peak = dunk ? 12 : 40 + dist([this.sx, this.sy], target) * 0.25;
  }
  updateShot(dt) {
    this.t += dt; const f = Math.min(1, this.t / this.dur);
    this.x = this.sx + (this.tx - this.sx) * f; this.y = this.sy + (this.ty - this.sy) * f;
    this.z = Math.sin(Math.PI * f) * this.peak + 20 * f;
    return f >= 1;
  }
  setLoose(x, y, vx, vy, z = 20, delay = 0.15) { Object.assign(this, { state: "loose", holder: null, passer: null, receiver: null, x, y, z, vx, vy, grabDelay: delay }); }
  updateLoose(dt) {
    this.grabDelay = Math.max(0, this.grabDelay - dt);
    this.x += this.vx * dt; this.y += this.vy * dt;
    const drag = Math.max(0, 1 - 1.6 * dt); this.vx *= drag; this.vy *= drag;
    this.z = Math.max(0, this.z - 60 * dt);
    const pad = 8;
    if (this.x < S.CL + pad || this.x > S.CR - pad) this.vx = -this.vx;
    if (this.y < S.CT + pad || this.y > S.CB - pad) this.vy = -this.vy;
    this.x = clamp(this.x, S.CL + pad, S.CR - pad); this.y = clamp(this.y, S.CT + pad, S.CB - pad);
  }
  setDead(x, y) { this.state = "dead"; this.holder = null; this.x = x; this.y = y; this.z = 0; }
}

// =====================================================================
// Match rules (same as game/match.py)
// =====================================================================
class Actor {
  constructor(p, team, slot) {
    Object.assign(this, { p, team, slot, x: 0, y: 0, vx: 0, vy: 0, dash: null, plant: 0, moveTag: null, stepBackT: 0, sprinting: false, stamina: 1, streak: 0, bounces: 0, fx: 0, fy: -1, stun: 0, cool: 0, burst: 0, jump: 0, points: 0, think: 0, spot: null, spotT: 0, holdT: 0 });
    // animation only (never affects the rules)
    const h = hashStr(p.name + p.number);
    this.look = { skin: SKINS[h % SKINS.length], hair: HAIRS[(h >>> 3) % HAIRS.length], style: (h >>> 6) % 4, shoe: SHOES[(h >>> 9) % SHOES.length] };
    this.anim = null; this.runPhase = 0; this.moveAmt = 0; this.hand = 1; this.dribble = (h % 100) / 10;
  }
  setAnim(kind, dur) { this.anim = { kind, t: 0, dur }; }
  animK(kind) { return this.anim && this.anim.kind === kind ? this.anim.t / this.anim.dur : -1; }
  get pos() { return [this.x, this.y]; }
  eff(k) { return effect(this.p, k); }
  baseSpeed() { return (S.BASE_SPEED + this.p.stats.speed * S.SPEED_PER) * (1 + this.eff("speed")); }
  maxSpeed() { let s = this.baseSpeed(); if (this.sprinting && this.stamina > 0.02) s *= S.SPRINT; if (this.burst > 0) s *= 1.2; return s; }
  get onFire() { return this.streak >= 2; }
}
const blankInputs = () => ({ move: [0, 0], shootPressed: false, shootDown: false, passPressed: false, movePressed: false, switchPressed: false, sprint: false });

class Match {
  constructor(teamA, teamB, rng, human = true, gameTo = S.GAME_TO, opts = {}) {
    this.rng = rng || new Rng(); this.human = human; this.gameTo = gameTo;
    this.scout = opts.scout || 0;            // 0..1: how well the other team has studied you
    this.favMove = opts.favMove || null;     // your most-used dribble move; scouted teams see it coming
    this.moveUse = {};
    this.actors = [...teamA.map((p, i) => new Actor(p, 0, i)), ...teamB.map((p, i) => new Actor(p, 1, i))];
    this.ball = new Ball(); this.score = [0, 0]; this.winner = null; this.messages = [];
    this.meter = null; this.elapsed = 0; this.controlled = this.team(0)[0];
    this.fx = { swish: 0, shake: 0 };
    this.events = [];   // things the screen shows and plays sounds for (makes, misses, greens, ankle breaks)
    this.setupCheck(0);
  }
  team(t) { return this.actors.filter(a => a.team === t); }
  get mainGuy() { return this.team(0)[0]; }
  say(text, secs = 1.6) { this.messages.push([text, secs]); this.messages = this.messages.slice(-3); }
  nearestOpp(a, pos) { pos = pos || a.pos; let best = null, bd = 1e9; for (const o of this.team(1 - a.team)) { const d = dist(o.pos, pos); if (d < bd) { bd = d; best = o; } } return [bd, best]; }
  openness(a) { return this.nearestOpp(a)[0]; }

  setupCheck(team) {
    Object.assign(this, { offense: team, phase: "check", phaseT: 0.5, needsClear: false, shotClock: S.SHOT_CLOCK, meter: null });
    const spots = [S.CHECK, [320, 330], [680, 330]];
    this.team(team).forEach((a, i) => { [a.x, a.y] = spots[i]; a.fx = 0; a.fy = -1; a.stun = 0; a.holdT = 0; a.spot = null; });
    this.team(1 - team).forEach((d, i) => { const sp = spots[i]; const [ux, uy] = norm(S.HOOP[0] - sp[0], S.HOOP[1] - sp[1]); d.x = sp[0] + ux * 40; d.y = sp[1] + uy * 40; d.fx = -ux; d.fy = -uy; d.stun = 0; d.spot = null; });
    this.ball.setHeld(this.team(team)[0]);
    if (this.human) this.controlled = this.team(0)[0];
  }
  turnover(t) {
    this.offense = t; this.needsClear = true; this.shotClock = S.SHOT_CLOCK; this.meter = null;
    for (const a of this.actors) { a.holdT = 0; a.spot = null; }
    if (this.human && t === 1) this.controlled = this.mainGuy;
  }

  update(dt, inp) {
    for (const a of this.actors) {
      if (a.anim) { a.anim.t += dt; if (a.anim.t >= a.anim.dur) a.anim = null; }
      if (a.moveTag) { a.moveTag.t -= dt; if (a.moveTag.t <= 0) a.moveTag = null; }
      a.stepBackT = Math.max(0, (a.stepBackT || 0) - dt);
      if (this.phase === "live" && a.sprinting && a.moveAmt > 0.3) { a.stamina = Math.max(0, a.stamina - S.STAMINA_DRAIN * dt); if (a.stamina <= 0) a.sprinting = false; }
      else a.stamina = Math.min(1, a.stamina + S.STAMINA_REGEN * dt);
      a.dribble += dt * 9;
      if (this.phase !== "live") a.moveAmt = Math.max(0, a.moveAmt - dt * 4);
    }
    this.fx.swish = Math.max(0, this.fx.swish - dt); this.fx.shake = Math.max(0, this.fx.shake - dt);
    for (const m of this.messages) m[1] -= dt;
    this.messages = this.messages.filter(m => m[1] > 0);
    if (this.phase === "over") return;
    this.elapsed += dt; this.phaseT -= dt;
    if (this.phase === "check") { if (this.phaseT <= 0) this.phase = "live"; return; }
    if (this.phase === "scored") { if (this.phaseT <= 0) this.setupCheck(this.offense); return; }
    let b = this.ball;
    if (b.state === "held" || b.state === "pass") {
      this.shotClock -= dt;
      if (this.shotClock <= 0) { this.say("Shot clock violation!"); this.setupCheck(1 - this.offense); return; }
    }
    if (this.human && inp && inp.switchPressed) this.switchControl();
    for (const a of this.actors) {
      a.cool = Math.max(0, a.cool - dt); a.burst = Math.max(0, a.burst - dt); a.jump = Math.max(0, a.jump - dt);
      if (a.stun > 0) { a.stun -= dt; a.dash = null; a.vx *= 0.8; a.vy *= 0.8; continue; }
      const mine = this.human && a === this.controlled;
      if (mine) a.sprinting = !!(inp && inp.sprint) && a.stamina > 0.02;
      const it = mine ? this.humanIntent(a, inp || blankInputs(), dt) : AI.decide(this, a, dt);
      if (!mine && this.human && a.team === 0) a.sprinting = false;
      this.moveActor(a, it.move, dt);
      if (it.action) this.act(a, it);
      if (this.phase !== "live") return;
    }
    this.separate();
    this.updateBall(dt);
    if (this.phase !== "live") return;
    b = this.ball;
    if (this.needsClear && b.state === "held" && b.holder.team === this.offense && beyondArc(b.holder.pos, 5)) { this.needsClear = false; this.say("Cleared", 0.8); }
    if (this.human && b.state === "held" && b.holder.team === 0) this.controlled = b.holder;
  }
  moveActor(a, move, dt) {
    let [mx, my] = move; const mag = Math.hypot(mx, my);
    if (mag > 1) { mx /= mag; my /= mag; }
    let speed = a.maxSpeed();
    if (this.ball.state === "held" && this.ball.holder === a) { speed *= 0.94; if (a === this.controlled && this.meter !== null) speed *= 0.3; }
    // players speed up and slow down smoothly instead of snapping
    const k = 1 - Math.exp(-S.ACCEL * dt);
    if (a.plant > 0 && !a.dash) { a.plant -= dt; a.vx = a.vy = 0; mx = my = 0; }
    else if (a.dash) {
      a.vx = a.dash.vx; a.vy = a.dash.vy; a.dash.t -= dt;
      if (a.dash.t <= 0) {
        if (a.dash.plant) { a.vx = a.vy = 0; a.plant = 0.28; } else { a.vx *= 0.35; a.vy *= 0.35; }
        a.dash = null;
      }
      mx = my = 0;   // keep facing while dashing
    } else { a.vx += (mx * speed - a.vx) * k; a.vy += (my * speed - a.vy) * k; }
    const ox = a.x, oy = a.y;
    [a.x, a.y] = clampCourt(a.x + a.vx * dt, a.y + a.vy * dt);
    const moved = Math.hypot(a.x - ox, a.y - oy);
    if (moved < Math.hypot(a.vx, a.vy) * dt * 0.5) { a.vx *= 0.5; a.vy *= 0.5; }   // ran into the fence
    a.runPhase += moved * 0.1;
    a.moveAmt = Math.min(1, Math.hypot(a.vx, a.vy) / a.maxSpeed());
    if (mag > 0.1 && Math.hypot(mx, my) > 0) {
      const [nx, ny] = norm(mx, my), t = Math.min(1, dt * 16);
      [a.fx, a.fy] = norm(a.fx + (nx - a.fx) * t, a.fy + (ny - a.fy) * t);
      if (!a.fx && !a.fy) [a.fx, a.fy] = [nx, ny];
    }
  }
  separate() {
    const r2 = S.PR * 2;
    for (let i = 0; i < this.actors.length; i++) for (let j = i + 1; j < this.actors.length; j++) {
      const a = this.actors[i], o = this.actors[j], d = dist(a.pos, o.pos);
      if (d > 0 && d < r2) { const push = (r2 - d) / 2, ux = (a.x - o.x) / d, uy = (a.y - o.y) / d; [a.x, a.y] = clampCourt(a.x + ux * push, a.y + uy * push); [o.x, o.y] = clampCourt(o.x - ux * push, o.y - uy * push); }
    }
  }
  switchControl() {
    if (this.ball.state === "held" && this.ball.holder.team === 0) return;
    const bp = [this.ball.x, this.ball.y];
    const order = [...this.team(0)].sort((p, q) => dist(p.pos, bp) - dist(q.pos, bp));
    this.controlled = order[0] === this.controlled ? order[1] : order[0];

const TIERS = [

// ---- positions: each one leans the stats a different way (the leanings add up to zero)

  return best;
}
function generatePlayer(rng, base, pos) {
  pos = pos || rng.choice(POSITIONS);
  const stats = {}; for (const s of S.STATS) stats[s] = clamp(base + POS_SHAPE[pos][s] + rng.randint(-6, 6), 20, S.STAT_MAX);
  const main = rng.random() < 0.75 ? rng.choice(POS_ATTRS[pos]) : rng.choice(ATTR_ORDER);

  const p = makePlayer(randomName(rng), rng.randint(0, 55), stats, mainLvl ? main : null, mainLvl, secLvl ? sec : null, secLvl);

// A crew is a guard, a wing and a big.
function makeCrew(rng, base) { return [rng.choice(["PG", "SG"]), rng.choice(["SF", "SG", "PF"]), rng.choice(["C", "PF"])].map(pos => generatePlayer(rng, base, pos)); }
function crewPlayers(ci, k) { return makeCrew(new Rng(`${TIERS[ci].court}|${TIERS[ci].crews[k]}`), TIERS[ci].base + ROUND_OFFSETS[k]); }

function bracket(tier, seed) {

    const players = makeCrew(rng, TIERS[tier].base + ROUND_OFFSETS[r]);

const MARKET_MS = 5 * 60 * 1000;
const RARITY = [   // name, base weight, how much fame/team level boosts it, rating offset, price per OVR point
  { name: "Common", w: 62, boost: 0, off: -4, price: 4, color: "#b9bcc6" },
  { name: "Rare", w: 26, boost: 1, off: 0, price: 6, color: "#5096f0" },

// Eternal cycles through every color; Mythic pulses red.
function rarityColor(r, t = performance.now() / 1000) {

}
// Eternal look: a rainbow that flows across the shape, a moving shine and sparkles.
function rainbow(x, y, w, h, t = performance.now() / 1000) {

  g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,0.38)"); g.addColorStop(1, "rgba(255,255,255,0)");

function marketOdds(luck) { const w = RARITY.map(r => r.w * (1 + r.boost * luck)), t = w.reduce((a, b) => a + b, 0); return RARITY.map((r, i) => [r, w[i] / t * 100]); }

class Career {
  constructor(d) {
    Object.assign(this, { cash: 100, fame: 0, tier: 0, champion: false, starters: [0, 1], tourney: null, entries: 0, titles: 0, games: 0, market: null, moves: {} }, d);
    // older saves: give everyone a position
    if (!this.me.pos) this.me.pos = "SF";
    for (const p of this.crew) if (!p.pos) p.pos = guessPos(p);
  }
  static fresh(name, main, pos = "SF") {
    const rng = new Rng();
    const stats = Object.fromEntries(S.STATS.map(s => [s, 40 + POS_SHAPE[pos][s]]));
    const me = makePlayer(name, rng.randint(0, 55), stats, main, 1); me.pos = pos;
    // every new baller starts with a point guard and a big man
    return new Career({ me, crew: [generatePlayer(rng, 33, "PG"), generatePlayer(rng, 33, "C")] });
  }
  get title() { return this.champion ? KING : TIERS[this.tier].title; }
  // Pickup games: two local crews at any court you've reached. They don't move you up.
  crewsFor(ci) {
    return [0, 1].map(k => { const players = crewPlayers(ci, k); return { id: `${ci}:${k}`, court: ci, name: TIERS[ci].crews[k], players, boss: false, ovr: teamOverall(players), mode: "pickup" }; });
  }
  enterTourney() { this.entries++; this.tourney = { tier: this.tier, seed: this.entries, round: 0 }; }
  tourneyGame() { const t = this.tourney; return t ? bracket(t.tier, t.seed)[t.round] : null; }
  lineup() { return [this.me, ...this.starters.map(i => this.crew[i])]; }
  secUnlocked() { return this.tier >= S.SEC_UNLOCK || this.champion; }
  crowdSize() { return clamp(Math.round(3 + this.fame * 0.18), 3, 140); }
  fameLoss() { return Math.min(this.fame, Math.round(2 + this.fame * 0.05)); }
  // Scouting: climb faster than expected (few games played, or a team rated under the level)
  // and other teams start studying you.
  scouting() {
    if (this.tier === 0) return 0;
    const fast = clamp((6 * this.tier - this.games) / (6 * this.tier), 0, 1) * 0.8;   // about 6 games per level is normal
    const under = clamp((TIERS[this.tier].base - 6 - teamOverall(this.lineup())) / 20, 0, 1);
    return Math.round(Math.max(fast, under) * 100) / 100;
  }
  favoriteMove() { let best = null, n = 2; for (const [k, v] of Object.entries(this.moves)) if (v > n) { n = v; best = k; } return best; }
  applyResult(crew, won, margin = 0, bet = 0, mult = 1, moveUse = {}) {
    const ci = crew.court, r = { fame: 0, cash: 0, betWin: 0, tips: 0, tierUp: false, crowned: false, nextRound: false, champ: false, eliminated: false };
    this.games++;
    for (const [k, v] of Object.entries(moveUse)) this.moves[k] = (this.moves[k] || 0) + v;
    if (won) {
      r.fame = (crew.mode === "tourney" ? 12 : 8) + 6 * ci + Math.floor(margin / 2);
      r.cash = (crew.mode === "tourney" ? 60 : 40) + 40 * ci;
      if (bet) r.betWin = Math.round(bet * mult);
      r.tips = Math.round(this.crowdSize() * 0.5);
      if (crew.mode === "tourney") {
        if (this.tourney.round < 2) { this.tourney.round++; r.nextRound = true; }
        else {   // won the whole tournament

          r.fame += 40 + 10 * ci; r.cash += 250 + 150 * ci;
          if (ci === this.tier && this.tier < TIERS.length - 1) { this.tier++; r.tierUp = true; }
          else if (ci === TIERS.length - 1 && !this.champion) { this.champion = true; r.crowned = true; }
        }
      }

      r.fame = -this.fameLoss(); r.cash = 10;

      lvl = me.secLvl;
    } else lvl = me.mainLvl;

}

// Luck (same as game/luck.py) — in-game cash only
// =====================================================================
const Luck = {
  SYMBOLS: ["BRICK", "BALL", "SHOE", "CASH", "CROWN", "MYTHIC", "ETERNAL"], WEIGHTS: [35, 25, 20, 13, 7, 4, 1.5], BETS: [10, 25, 50, 100, 250, 500],
  RARITIES: [["Bum", 40, -14], ["Solid", 34.5, -2], ["Baller", 19.8, 8], ["Legend", 4.7, 18], ["Mythic", 0.8, 26], ["Eternal", 0.2, 34]],
  spin(rng) { return [0, 1, 2].map(() => rng.choices(this.SYMBOLS, this.WEIGHTS)); },
  payout(reels) {
    const counts = {}; for (const s of reels) counts[s] = (counts[s] || 0) + 1;
    const [sym, n] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    if (n === 3) return { CROWN: 20, MYTHIC: 100, ETERNAL: 1000 }[sym] || 5;
    if (n === 2) { if (sym === "ETERNAL") return 25; if (sym === "MYTHIC") return 8; if (sym === "CASH" || sym === "CROWN") return 2; if (sym !== "BRICK") return 1; }
    return 0;
  },
  playSlots(c, bet, rng) { if (bet <= 0 || bet > c.cash) return null; c.cash -= bet; const reels = this.spin(rng), win = bet * this.payout(reels); c.cash += win; return [reels, win]; },
  mysteryCost(tier) { return 150 + 120 * tier; },
  rollMystery(c, rng) {
    const cost = this.mysteryCost(c.tier);
    if (c.cash < cost || c.crew.length >= S.CREW_MAX) return null;
    c.cash -= cost;
    const r = rng.choices(this.RARITIES, this.RARITIES.map(x => x[1]));
    const p = generatePlayer(rng, TIERS[c.tier].base + r[2]); c.crew.push(p);
    return [r[0], p];
  },
  wagerMult(mine, opp) { return Math.round(clamp(1.6 + (opp - mine) / 12, 1.2, 4.0) * 10) / 10; },
  placeBet(c, bet) { if (bet < 0 || bet > c.cash) return false; c.cash -= bet; return true; },
};

const canvas = document.getElementById("game");

// =====================================================================
// Sound: small synthesized effects. Starts after the first key press or tap. M toggles.
// =====================================================================
const Sound = {
  ctx: null, on: true,
  wake() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch (e) { this.ctx = null; } },
  out(gain, t0) { const g = this.ctx.createGain(); g.gain.value = 0; g.connect(this.ctx.destination); return g; },
  tone(freq, dur, type = "sine", gain = 0.15, slideTo = null, delay = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = this.out();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, type, freq, q, gain, attack = 0.005, delay = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, len = Math.ceil(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = this.out();
    src.buffer = buf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); src.start(t); src.stop(t + dur + 0.05);
  },
  dribble() { this.tone(140, 0.07, "sine", 0.18, 70); },
  swish() { this.noise(0.28, "bandpass", 4200, 0.9, 0.22, 0.02); },
  rimIn() { this.tone(520, 0.12, "triangle", 0.07); this.noise(0.2, "bandpass", 3500, 0.8, 0.12, 0.01, 0.06); },
  clank() { this.tone(390, 0.18, "square", 0.06); this.tone(610, 0.14, "triangle", 0.05, null, 0.02); },
  dunk() { this.tone(110, 0.3, "sine", 0.5, 38); this.noise(0.25, "lowpass", 900, 1, 0.35); this.tone(300, 0.25, "square", 0.05, 180, 0.02); },
  green() { this.tone(988, 0.12, "sine", 0.14); this.tone(1319, 0.16, "sine", 0.14, null, 0.08); this.tone(1976, 0.22, "sine", 0.09, null, 0.16); },
  fire() { this.noise(0.9, "lowpass", 700, 0.7, 0.25, 0.08); this.tone(220, 0.6, "sawtooth", 0.04, 440); },
  ankles() { this.noise(0.12, "highpass", 3000, 1, 0.12); this.tone(260, 0.2, "triangle", 0.06, 120, 0.03); },
  steal() { this.tone(700, 0.08, "square", 0.05, 900); },
  cheer(size, big) { const g = Math.min(0.32, 0.03 + size / 140 * 0.22) * (big ? 1.4 : 1); this.noise(big ? 1.8 : 1.1, "bandpass", 1100, 0.45, g, 0.18); this.noise(big ? 1.6 : 1.0, "bandpass", 2400, 0.6, g * 0.5, 0.2); },
  groan(size) { const g = Math.min(0.15, 0.02 + size / 140 * 0.1); this.noise(0.8, "lowpass", 500, 0.7, g, 0.15); },
};

class Menu {
  constructor(items) { this.items = items; this.i = 0; }
  key(k) {
    if (!this.items.length) return;
    if (K.up(k)) this.i = (this.i - 1 + this.items.length) % this.items.length;
    else if (K.down(k)) this.i = (this.i + 1) % this.items.length;
    else if (K.ok(k)) this.items[this.i][1]();
  }
  draw(x, y, gap = 46, size = 38) {

    });
  }
}

class CourtScreen extends Screen {
  constructor() { super(); this.ci = this.c.tier; this.sel = 0; this.msg = ""; }
  options() {
    const c = this.c, out = [];
    if (this.ci === c.tier && !c.champion) {
      const g = c.tourney && c.tourney.tier === this.ci ? c.tourneyGame() : null;
      out.push({ kind: "tourney", game: g });
    }
    for (const crew of c.crewsFor(this.ci)) out.push({ kind: "pickup", game: crew });
    return out;
  }
  pick(i) {
    const c = this.c, o = this.options()[i]; this.sel = i;
    if (!o) return;
    if (o.kind === "tourney") { if (!o.game) { c.enterTourney(); App.save(); } App.switch(new WagerScreen(this.ci, c.tourneyGame())); }
    else App.switch(new WagerScreen(this.ci, o.game));
  }
  key(k) {
    const n = this.options().length;
    if (K.back(k)) App.switch(new HubScreen());
    else if (K.left(k)) { this.ci = Math.max(0, this.ci - 1); this.sel = 0; }
    else if (K.right(k)) { this.ci = Math.min(this.c.tier, this.ci + 1); this.sel = 0; }
    else if (K.up(k)) this.sel = (this.sel - 1 + n) % n;
    else if (K.down(k)) this.sel = (this.sel + 1) % n;

  }

    const c = this.c; drawCourt(this.ci);

          text(t ? `OVR ${games[r].ovr}${done ? "  ✓" : ""}` : "", x + 12, y + 136, { size: 20, color: done ? C.green : C.grey, weight: 500 });
        });

    });

class WagerScreen extends Screen {
  constructor(ci, crew) {
    super(); this.ci = ci; this.crew = crew;
    const cash = this.c.cash;
    this.bets = [0, ...[25, 50, 100, 250, 500, 1000].filter(b => b <= cash)];
    if (cash > 0 && !this.bets.includes(cash)) this.bets.push(cash);
    this.i = 0; this.mult = Luck.wagerMult(teamOverall(this.c.lineup()), crew.ovr);
  }
  go() { const bet = this.bets[this.i]; if (Luck.placeBet(this.c, bet)) { App.save(); App.switch(new MatchScreen(this.ci, this.crew, bet, this.mult)); } }
  key(k) {
    if (K.back(k)) App.switch(new CourtScreen());
    else if (K.left(k)) this.i = Math.max(0, this.i - 1);
    else if (K.right(k)) this.i = Math.min(this.bets.length - 1, this.i + 1);
    else if (K.ok(k)) this.go();
  }
  draw() {
    this.header("Side Bet?"); this.backButton(() => App.switch(new CourtScreen()));
    const c = this.c, bet = this.bets[this.i];
    text(`Your crew OVR ${teamOverall(c.lineup())}   vs   ${this.crew.name} OVR ${this.crew.ovr}`, 500, 190, { size: 34, center: true });
    text(`Bet on yourself. Win and you get ${this.mult}x your bet back. Lose and it's gone.`, 500, 238, { size: 27, color: C.grey, center: true, weight: 500 });
    const allIn = bet === c.cash && ![25, 50, 100, 250, 500, 1000].includes(bet);
    text(bet === 0 ? "No bet" : allIn ? `ALL IN  $${bet}` : `$${bet}`, 500, 330, { size: 64, color: bet ? C.gold : C.white, center: true, display: true });
    text("◀", 250, 330, { size: 60, center: true }); hit(210, 295, 80, 70, () => { this.i = Math.max(0, this.i - 1); });
    text("▶", 750, 330, { size: 60, center: true }); hit(710, 295, 80, 70, () => { this.i = Math.min(this.bets.length - 1, this.i + 1); });
    if (bet) text(`Win pays $${Math.round(bet * this.mult)}`, 500, 395, { size: 30, color: C.green, center: true });
    text("Lineup: " + c.lineup().map(p => p.name).join(", "), 500, 450, { size: 26, color: C.grey, center: true, weight: 500 });
    rrect(390, 500, 220, 60, 10, C.orange); text("TIP OFF", 500, 530, { size: 34, color: "#1a0f05", center: true, display: true });
    hit(390, 500, 220, 60, () => this.go());

}

// ---------------------------------------------------------------- match
// ---- players drawn as people seen from above --------------------------------
const TEAM_DARK = ["#1f4f9e", "#8e2622"];
const TEAM_TRIM = ["#dfe9ff", "#ffe2dc"];
function ellipse(x, y, rx, ry, fill, stroke, lw = 1) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
const ease = t => t < 0 ? 0 : Math.sin(Math.PI * Math.min(1, t));   // 0 → 1 → 0
function toWorld(a, ang, lx, ly) { const c = Math.cos(ang), s = Math.sin(ang); return [a.x + lx * c - ly * s, a.y + lx * s + ly * c]; }

// Players stand upright on the bird's-eye court (three-quarter view).
// pose() says where the hands and ball are, relative to the feet, in screen pixels.
function pose(m, a) {
  const b = m.ball, holding = b.state === "held" && b.holder === a;
  const dir = a.fx >= 0 ? 1 : -1;
  const swing = Math.sin(a.runPhase) * a.moveAmt;
  let lift = 0, crouch = 0, lean = 0, L = [-11, -22 + swing * 4], R = [11, -22 - swing * 4], ball = null, stance = false;
  const shoot = a.animK("shoot"), dunk = a.animK("dunk"), jump = a.animK("jump"), block = a.animK("block");
  const pass = a.animK("pass"), cross = a.animK("cross"), reach = a.animK("reach"), cele = a.animK("celebrate");
  const metering = holding && m.meter !== null && a === m.controlled;
  const layup = a.animK("layup");
  if (dunk >= 0) { lift = ease(dunk); L = [-4, -62]; R = [4, -62]; }
  else if (layup >= 0) { lift = ease(layup) * 0.75; L = [-10, -34]; R = [dir * 6, -62]; }
  else if (shoot >= 0) { lift = ease(shoot) * 0.6; L = [-4, -56]; R = [5, -58]; }
  else if (block >= 0) { lift = ease(block) * 0.9; L = [-13, -58]; R = [13, -58]; }
  else if (jump >= 0) { lift = ease(jump) * 0.7; L = [-12, -56]; R = [12, -56]; }
  else if (cele >= 0) { lift = Math.abs(Math.sin(cele * Math.PI * 3)) * 0.4; L = [-16, -54]; R = [16, -54]; }
  else if (metering) { crouch = 3; L = [-5, -52]; R = [5, -53]; ball = [0, -57, 0]; }
  else if (holding && m.phase === "check") { L = [-6, -27]; R = [6, -27]; ball = [0, -27, 0]; }
  else if (holding) {
    const h = a.hand, u = Math.abs(Math.sin(a.dribble));      // h: which side of the screen the ball is on; u: 0 = in the hand, 1 = on the floor
    let bx = h * 13, by = -20 + 18 * u;
    const step = a.animK("stepback"), hesi = a.animK("hesi"), go = a.animK("go");
    if (cross >= 0) {        // low, quick bounce from one hand to the other
      const t = Math.min(1, cross * 1.5); bx = h * (-14 + 28 * t); by = -5 - 5 * Math.sin(Math.PI * t);
      crouch = 6 * ease(cross); lean = h * 5 * ease(cross);
    } else if (step >= 0) {  // hop back and gather the ball at the chest
      const t = step; bx = h * 8 * (1 - ease(t)); by = -28 + 8 * (1 - ease(t));
      lift = ease(t) * 0.25; lean = 0;
    } else if (hesi >= 0) {  // fake: rise up like a shot, then back into the dribble
      bx = h * 6; by = -34 * ease(hesi) - 20 * (1 - ease(hesi)); lift = ease(hesi) * 0.12;
    } else if (go >= 0) { crouch = 6 * ease(go); lean = 0; }
    const hand = [bx, Math.min(by, -18) - 2];
    if (step >= 0 || hesi >= 0) { L = [bx - 6, by]; R = [bx + 6, by]; }
    else if (h > 0) { R = hand; L = [-15, -28]; } else { L = hand; R = [15, -28]; }
    crouch = Math.max(crouch, 2); ball = [bx, by, 0];
  } else if (reach >= 0) { const k = ease(reach); R = [dir * (11 + 14 * k), -24]; crouch = 3 * k; }
  else if (pass >= 0) { const k = ease(pass); L = [dir * 16 * k - 4, -30]; R = [dir * 16 * k + 4, -30]; }
  else if (a.team !== m.offense && b.state === "held" && b.holder && b.holder.team !== a.team && dist(a.pos, b.holder.pos) < 70) {
    stance = true; crouch = 4; L = [-20, -26]; R = [20, -26];     // defensive stance: low, arms out wide
  }
  return { lift, crouch, lean, L, R, ball, stance, swing, dir };
}

function drawPerson(m, a, highlight) {
  const P = pose(m, a), look = a.look, team = a.team;
  const up = P.lift * 24, x = a.x, y = a.y;
  const front = a.fy > -0.2;          // facing the camera (down the screen) shows the face
  if (a.onFire) {   // flames lick up around a player who's on fire
    for (let i = 0; i < 7; i++) {
      const t = m.elapsed * 7 + i * 1.7, fx = Math.sin(t * 1.3 + i) * 9, h = 18 + (Math.sin(t) * 0.5 + 0.5) * 22;
      ctx.beginPath(); ctx.moveTo(x + fx - 5, y); ctx.quadraticCurveTo(x + fx * 1.4, y - h * 0.6, x + fx * 0.6, y - h); ctx.quadraticCurveTo(x + fx * 0.2, y - h * 0.5, x + fx + 5, y); ctx.closePath();
      ctx.fillStyle = i % 2 ? "rgba(255,90,20,0.55)" : "rgba(255,200,40,0.5)"; ctx.fill();
    }
  }
  if (a.dash) { for (let i = 1; i <= 3; i++) ellipse(x - a.dash.vx * 0.018 * i, y - a.dash.vy * 0.018 * i + 1, 10 - i * 2, 4 - i * 0.8, `rgba(255,255,255,${0.16 - i * 0.04})`); }
  // shadow on the court
  ellipse(x, y + 1, 13 - P.lift * 3, 5 - P.lift, `rgba(0,0,0,${0.45 - P.lift * 0.15})`);
  const isMain = team === 0 && a.slot === 0;
  if (isMain) ellipse(x, y + 1, 17, 7, null, C.gold, 2.5);
  if (highlight) { const pulse = 1.5 + 1.5 * Math.sin(m.elapsed * 8); ellipse(x, y + 1, 20 + pulse, 9 + pulse / 2, null, "rgba(255,255,255,0.9)", 2); }

  ctx.save();
  const sz = POS_SIZE[a.p.pos] || 1;
  ctx.translate(x, y - up + P.crouch);
  ctx.scale(sz, sz);
  if (a.stun > 0) ctx.rotate(Math.sin(m.elapsed * 24) * 0.18);
  else if (P.lean) ctx.transform(1, 0, -P.lean / 40, 1, 0, 0);   // lean into the move
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // legs: stride while running, wide in a defensive stance, tucked in the air
  const spread = P.stance ? 9 : 5, air = P.lift > 0.05;
  for (const side of [-1, 1]) {
    const step = air ? 0 : side * P.swing * 6;
    const fx = side * spread + P.dir * step, fy = air ? -4 : -Math.max(0, side * P.swing) * 4;
    ctx.strokeStyle = look.skin; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(side * 4, -17 + P.crouch * 0.5); ctx.quadraticCurveTo(side * (spread + 1) + P.dir * step * 0.5, -9, fx, fy - 3); ctx.stroke();
    ctx.fillStyle = look.shoe; ctx.beginPath(); ctx.ellipse(fx + P.dir * 2, fy - 1.5, 4.8, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 1; ctx.stroke();
  }
  // shorts
  ctx.fillStyle = TEAM_DARK[team]; ctx.beginPath(); ctx.roundRect(-9, -22, 18, 9, 3); ctx.fill();
  // back arm first when facing away, so it sits behind the body
  const arm = (hx, hy, sx) => {
    ctx.strokeStyle = look.skin; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(sx, -34); ctx.quadraticCurveTo(sx + (hx - sx) * 0.4 + Math.sign(sx) * 3, (hy - 34) / 2 - 4, hx, hy); ctx.stroke();
    circle(hx, hy, 3, look.skin, "rgba(0,0,0,0.35)", 1);
  };
  // jersey
  ctx.fillStyle = a.stun > 0 ? TEAM_DARK[team] : C.team[team];
  ctx.beginPath(); ctx.moveTo(-9, -37); ctx.lineTo(9, -37); ctx.lineTo(10, -21); ctx.lineTo(-10, -21); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = TEAM_TRIM[team]; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = TEAM_TRIM[team]; ctx.font = `700 10px ${FONT_BODY}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(String(a.p.number), 0, -28.5);
  arm(P.L[0], P.L[1], -9); arm(P.R[0], P.R[1], 9);
  // neck, head and hair
  ctx.fillStyle = look.skin; ctx.fillRect(-2, -41, 4, 5);
  const hy = -46;
  if (look.style === 1) circle(0, hy - 1, 9.5, look.hair);                                   // afro sits behind the face
  circle(0, hy, 7, look.skin, "rgba(0,0,0,0.3)", 1);
  if (front) {
    ctx.fillStyle = look.hair;
    if (look.style !== 1) { ctx.beginPath(); ctx.arc(0, hy, 7, Math.PI * 1.05, Math.PI * 1.95); ctx.fill(); }
    ctx.fillStyle = "#1a1a1a"; circle(-2.5 + P.dir, hy + 0.5, 1.1, "#1a1a1a"); circle(2.5 + P.dir, hy + 0.5, 1.1, "#1a1a1a");
    if (a.anim && a.anim.kind === "celebrate") { ctx.beginPath(); ctx.arc(P.dir, hy + 3, 2.4, 0, Math.PI); ctx.fill(); }
  } else if (look.style !== 1) { circle(0, hy, 7, look.hair); }
  if (look.style === 2) { ctx.strokeStyle = team === 0 ? "#ffffff" : "#ffd23c"; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(-7, hy - 2); ctx.lineTo(7, hy - 2); ctx.stroke(); }  // headband
  if (look.style === 3) { ctx.strokeStyle = look.hair; ctx.lineWidth = 1.8; for (const bx of [-5, -2, 2, 5]) { ctx.beginPath(); ctx.moveTo(bx, hy + 2); ctx.lineTo(bx * 1.2, hy + 9); ctx.stroke(); } } // braids
  ctx.restore();

  if (a.stun > 0) {   // ankles broken: stars spin around the head
    for (let i = 0; i < 3; i++) { const t = m.elapsed * 6 + i * 2.1; text("✦", x + Math.cos(t) * 12, y - 58 + Math.sin(t) * 4, { size: 18, color: C.gold, center: true }); }
  }
  if (highlight) {
    const ty = y - up - 64;
    ctx.beginPath(); ctx.moveTo(x - 7, ty); ctx.lineTo(x + 7, ty); ctx.lineTo(x, ty + 9); ctx.closePath(); ctx.fillStyle = C.gold; ctx.fill();
    text(a.p.name, x, y + 16, { size: 20, center: true });
  }
  if (a.moveTag) {   // name of the dribble move pops above the player
    const k = a.moveTag.t / 0.8;
    ctx.globalAlpha = Math.min(1, k * 2);

    ctx.globalAlpha = 1;
  }
  if (P.ball) return { x: x + (P.ball[0] - (P.lean || 0) * P.ball[1] / 40) * sz, y: y - up + P.crouch + P.ball[1] * sz };

}

// x, y = spot on the court under the ball; h = height above the court in pixels
function drawBall(x, y, h, t, r = 6.5) {
  ellipse(x, y + 1, r * 0.95, r * 0.45, `rgba(0,0,0,${Math.max(0.15, 0.45 - h / 200)})`);
  const by = y - h, rr = r;
  circle(x, by, rr, C.orange, "#3c1e0a", 1.2);
  ctx.save(); ctx.translate(x, by); ctx.rotate(t * 6);
  ctx.strokeStyle = "#3c1e0a"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-rr, 0); ctx.lineTo(rr, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(-rr * 1.2, 0, rr * 0.95, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(rr * 1.2, 0, rr * 0.95, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  ctx.restore();
  circle(x - rr * 0.35, by - rr * 0.35, rr * 0.3, "rgba(255,255,255,0.2)");
}

function drawRimFx(m) {
  const [hx, hy] = S.HOOP, sh = m.fx.shake, sw = m.fx.swish;
  const ox = sh > 0 ? Math.sin(m.elapsed * 70) * 3 * (sh / 0.45) : 0;
  // net hangs toward the court; ripples on a make
  const drop = 10 + sw * 14;
  ctx.strokeStyle = "rgba(245,245,245,0.85)"; ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const a1 = Math.PI * 0.1 + i * Math.PI * 0.8 / 7;
    const x1 = hx + ox + Math.cos(a1) * 11, y1 = hy + Math.sin(a1) * 11 * 0.6;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(hx + ox + Math.cos(a1) * 6, hy + drop); ctx.stroke();
  }
  circle(hx + ox, hy, 11, null, C.orange, 3);
}

function drawActors(m, controlled) {
  const b = m.ball;
  // players nearer the bottom of the screen are drawn last so overlaps look right
  const order = [...m.actors].sort((p, q) => p.y - q.y);
  let held = null;
  drawRimFx(m);
  for (const a of order) { const hb = drawPerson(m, a, controlled && a === m.controlled); if (hb) held = hb; }
  if (b.state === "held" && held) drawBall(held.x, b.holder.y, b.holder.y - held.y, m.elapsed);
  else if (b.state === "shot") {
    const f = Math.min(1, b.t / b.dur), h = 50 * (1 - f) + b.z * 0.8 + 10 * f;
    b.trail = b.trail || []; b.trail.push([b.x, b.y - h]); if (b.trail.length > 12) b.trail.shift();
    const col = b.fire ? "255,120,30" : b.green ? "255,215,80" : "255,255,255";
    b.trail.forEach(([tx, ty], i) => circle(tx, ty, 2 + i * (b.green || b.fire ? 0.7 : 0.35), `rgba(${col},${(i / b.trail.length) * (b.green || b.fire ? 0.55 : 0.2)})`));
    if (b.green || b.fire) circle(b.x, b.y - h, 13, `rgba(${col},0.25)`);
    drawBall(b.x, b.y, h, m.elapsed);
  }
  else if (b.state === "pass") drawBall(b.x, b.y, 28, m.elapsed);
  else if (b.state === "loose") drawBall(b.x, b.y, 4 + b.z * 1.2 + Math.abs(Math.sin(m.elapsed * 10)) * Math.min(14, b.z), m.elapsed);
  else if (b.state === "dead") drawBall(b.x, b.y + 14, 4, m.elapsed);
}

// Fans stand along the fences. More fame = more people show up.
function makeCrowd(size, seed) {
  const rng = new Rng(seed), slots = [];
  for (const side of [-1, 1]) for (let row = 0; row < 3; row++) for (let y = 96; y <= 640; y += 25) {
    const x = side < 0 ? 58 - row * 22 : 942 + row * 22;
    slots.push({ x: x + rng.uniform(-3, 3), y: y + row * 8 + rng.uniform(-3, 3), side, rank: row * 1000 + Math.abs(y - 360) + rng.uniform(0, 60) });
  }
  slots.sort((p, q) => p.rank - q.rank);
  return slots.slice(0, size).map(sl => ({ ...sl, skin: rng.choice(SKINS), shirt: rng.choice(["#e04a3a", "#2f7de0", "#f5c83c", "#3ecf7a", "#f2f2f2", "#9b59b6", "#ff8a3d", "#222"]), hair: rng.choice(HAIRS), ph: rng.uniform(0, 6.28), hype: rng.uniform(0.6, 1.2) }))
    .sort((p, q) => p.y - q.y);
}
function drawCrowd(crowd, t, excite) {
  for (const f of crowd) {
    const jump = Math.max(0, Math.sin(t * 9 * f.hype + f.ph)) * 7 * excite, bob = Math.sin(t * 2 + f.ph) * 0.8;
    const x = f.x, y = f.y - jump + bob;
    ellipse(f.x, f.y + 9, 6, 2.5, "rgba(0,0,0,0.35)");
    const arm = excite > 0.25 ? -16 : -4;
    ctx.strokeStyle = f.skin; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x - 5, y - 6); ctx.lineTo(x - 8, y + arm + Math.sin(t * 12 + f.ph) * 2 * excite); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 5, y - 6); ctx.lineTo(x + 8, y + arm + Math.cos(t * 12 + f.ph) * 2 * excite); ctx.stroke();
    ctx.fillStyle = f.shirt; ctx.beginPath(); ctx.roundRect(x - 5.5, y - 8, 11, 14, 3); ctx.fill();
    circle(x, y - 13, 4.8, f.skin); ctx.beginPath(); ctx.arc(x, y - 13, 4.8, Math.PI, 2 * Math.PI); ctx.fillStyle = f.hair; ctx.fill();
  }
}

class MatchScreen extends Screen {
  constructor(ci, crew, bet = 0, mult = 1) {
    super(); Object.assign(this, { ci, crew, bet, mult, paused: false, doneT: 0 });
    this.scout = this.c.scouting();
    this.match = new Match(this.c.lineup(), crew.players, new Rng(), true, S.GAME_TO, { scout: this.scout, favMove: this.c.favoriteMove() });
    this.crowdN = this.c.crowdSize();
    this.crowd = makeCrowd(this.crowdN, crew.id + ":" + this.c.fame);
    this.parts = []; this.pops = []; this.excite = 0.15; this.shake = 0; this.flash = 0; this.freeze = null; this.lastBounce = 0;
  }
  burst(x, y, n, colors, speed = 160, up = 60) {
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = speed * (0.4 + Math.random() * 0.8);
      this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - up, life: 0.6 + Math.random() * 0.5, max: 1.1, col: colors[i % colors.length], r: 2 + Math.random() * 2.5, g: 260 }); }
  }
  pop(txt, x, y, color, size = 40, life = 1.1) { this.pops.push({ txt, x, y, color, size, life, max: life }); }
  handleEvents() {
    const m = this.match, [hx, hy] = S.HOOP, crowd = this.crowdN;
    for (const e of m.events) {
      if (e.type === "release" && e.human) {
        const a = m.controlled;
        this.freeze = { t: 0.5, green: e.green };
        if (e.green) { Sound.green(); this.flash = 0.35; this.shake = Math.max(this.shake, 0.12); this.pop("GREEN!", a.x, a.y - 100, C.green, 54, 1.0); this.burst(a.x, a.y - 60, 16, ["#7dff9a", "#e8ffe9", C.gold], 140, 40); }
      } else if (e.type === "make") {
        const mine = e.team === 0;
        if (e.kind === "dunk") { Sound.dunk(); this.shake = Math.max(this.shake, 0.4); this.burst(hx, hy, 30, [C.orange, C.gold, "#fff"], 260, 30); this.pop("SLAM!", hx, hy + 40, C.orange, 60); }
        else if (e.swish) { Sound.swish(); this.burst(hx, hy + 6, e.green ? 28 : 16, e.green ? [C.gold, "#fff5c4", "#7dff9a"] : ["#ffffff", "#cfe3ff"], e.green ? 220 : 150, 20); this.pop(e.green ? "SPLASH!" : "SWISH", hx, hy + 44, e.green ? C.gold : C.white, e.green ? 52 : 40); }
        else { Sound.rimIn(); this.burst(hx, hy, 10, [C.orange, "#fff"], 120, 10); }
        this.pop(`+${e.points}`, hx + 50, hy + 10, mine ? C.team[0] : C.team[1], 46, 0.9);
        if (e.newFire) { Sound.fire(); this.pop("ON FIRE!", 500, 330, "#ff7a1a", 70, 1.6); this.shake = Math.max(this.shake, 0.3); }
        const big = e.kind === "dunk" || e.green || e.newFire || e.points === 2;
        if (mine) { this.excite = Math.min(1.4, this.excite + (big ? 1.2 : 0.7)); Sound.cheer(crowd, big); }
        else { this.excite = Math.min(1, this.excite + 0.3); Sound.groan(crowd); }
      } else if (e.type === "miss") { Sound.clank(); if (e.team === 0) this.pop("CLANK", hx, hy + 40, C.grey, 30, 0.7); }
      else if (e.type === "ankles") { Sound.ankles(); this.burst(e.x, e.y, 10, [C.gold, "#fff"], 90, 60); if (e.team === 0) { this.excite = Math.min(1.4, this.excite + 0.8); Sound.cheer(crowd, false); } }
      else if (e.type === "block") { Sound.clank(); this.shake = Math.max(this.shake, 0.2); this.pop("REJECTED!", e.x, e.y - 90, C.red, 44); }
      else if (e.type === "steal") { Sound.steal(); }
    }
    m.events.length = 0;
  }
  finish(forfeit = false) { App.switch(new ResultScreen(this.ci, this.crew, this.match, this.bet, this.mult, forfeit)); }
  key(k) {
    if (k === "Escape" || k === "p" || k === "P") this.paused = !this.paused;
    else if (this.paused && (k === "f" || k === "F")) this.finish(true);
  }
  update(dt) {
    if (this.paused) return;
    const ks = App.keys, t = App.touch;
    const mx = ((ks.has("d") || ks.has("arrowright") || t.right) ? 1 : 0) - ((ks.has("a") || ks.has("arrowleft") || t.left) ? 1 : 0);
    const my = ((ks.has("s") || ks.has("arrowdown") || t.down) ? 1 : 0) - ((ks.has("w") || ks.has("arrowup") || t.up) ? 1 : 0);
    const inp = App.edges; inp.move = [mx, my]; inp.shootDown = ks.has(" ") || t.shoot;
    inp.sprint = ks.has("shift") || t.sprint;
    this.match.update(Math.min(dt, 1 / 30), inp);
    App.edges = blankInputs();
    this.handleEvents();
    // dribble sound for the ball you're holding
    const m = this.match, b = m.ball;
    if (b.state === "held" && b.holder === m.controlled && m.phase === "live" && m.meter === null) {
      const n = Math.floor(b.holder.dribble / Math.PI);
      if (n !== this.lastBounce) { this.lastBounce = n; Sound.dribble(); }
    }
    for (const q of this.parts) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    this.parts = this.parts.filter(q => q.life > 0);
    for (const q of this.pops) q.life -= dt;
    this.pops = this.pops.filter(q => q.life > 0);
    // embers rise off players who are on fire
    for (const a of m.actors) if (a.onFire && Math.random() < dt * 25) this.parts.push({ x: a.x + (Math.random() - 0.5) * 20, y: a.y - Math.random() * 30, vx: (Math.random() - 0.5) * 30, vy: -60 - Math.random() * 60, life: 0.7, max: 0.7, col: Math.random() < 0.5 ? "#ff7a1a" : "#ffd23c", r: 1.5 + Math.random() * 2, g: -20 });
    this.excite = Math.max(0.12, this.excite - dt * 0.6);
    this.shake = Math.max(0, this.shake - dt); this.flash = Math.max(0, this.flash - dt);
    if (this.freeze) { this.freeze.t -= dt; if (this.freeze.t <= 0) this.freeze = null; }
    if (this.match.phase === "over") { this.doneT += dt; if (this.doneT > 1.8) this.finish(); }
  }
  draw() {
    const m = this.match;
    const sk = this.shake > 0 ? this.shake * 14 : 0;
    ctx.save();
    if (sk) ctx.translate((Math.random() - 0.5) * sk, (Math.random() - 0.5) * sk);
    drawCourt(this.ci);
    drawCrowd(this.crowd, m.elapsed, this.excite);
    drawActors(m, true);
    for (const q of this.parts) circle(q.x, q.y, q.r * Math.max(0.3, q.life / q.max), q.col);
    // shot meter: fills while you hold, then freezes for a moment where you let go
    const a = m.controlled;
    if (m.meter !== null || this.freeze) {
      const x = a.x + 26, y = a.y - 70, h = 64, w = m.meterWindow(a);
      const lo = S.METER_SWEET - w, hi = S.METER_SWEET + w;
      const val = m.meter !== null ? Math.min(1, m.meter) : (m.lastRelease != null ? m.lastRelease : 0);
      const green = this.freeze && this.freeze.green;
      rrect(x - 2, y - 2, 14, h + 4, 4, "rgba(10,10,14,0.85)");
      ctx.fillStyle = green ? "#7dff9a" : C.green; ctx.fillRect(x, y + h - hi * h, 10, (hi - lo) * h);
      ctx.fillStyle = this.freeze ? (green ? "#b8ffc8" : C.red) : C.white; ctx.fillRect(x + 2, y + h - val * h, 6, val * h);
      if (green) { ctx.strokeStyle = `rgba(125,255,154,${this.freeze.t * 2})`; ctx.lineWidth = 3; ctx.strokeRect(x - 4, y - 4, 18, h + 8); }
    }
    // stamina bar while sprinting or recovering
    if (a.stamina < 0.999) {
      const x = a.x - 16, y = a.y + 22;
      rrect(x, y, 32, 5, 2.5, "rgba(10,10,14,0.8)");
      rrect(x, y, 32 * a.stamina, 5, 2.5, a.stamina > 0.3 ? "#5ad2ff" : C.red);
    }
    for (const q of this.pops) {
      const k = q.life / q.max, pop = k > 0.85 ? 1 + (k - 0.85) * 4 : 1;
      ctx.globalAlpha = Math.min(1, k * 2.5);
      text(q.txt, q.x, q.y - (1 - k) * 30, { size: q.size * pop, color: q.color, center: true, display: true });
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (this.flash > 0) { ctx.fillStyle = `rgba(125,255,154,${this.flash * 0.35})`; ctx.fillRect(0, 0, S.W, S.H); }
    ctx.fillStyle = "#0f0f14"; ctx.fillRect(0, 0, S.W, 44);
    text(`YOU  ${m.score[0]}`, 330, 23, { size: 34, color: C.team[0], center: true, display: true });
    text(`first to ${m.gameTo}`, 500, 23, { size: 24, color: C.grey, center: true });
    text(`${m.score[1]}  ${this.crew.name.toUpperCase()}`, 690, 23, { size: 30, color: C.team[1], center: true, display: true });
    text(`${TIERS[this.ci].court} · crowd ${this.crowdN}`, 16, 14, { size: 22, color: C.grey });
    text(`Shot ${Math.max(0, Math.ceil(m.shotClock))}`, S.W - 16, 12, { size: 26, right: true });
    if (this.scout >= 0.15) text(`SCOUTED ${Math.round(this.scout * 100)}%`, S.W - 16, 50, { size: 20, color: "#ff8a7a", right: true, display: true });
    if (m.needsClear) text(`${m.offense === 0 ? "YOU" : "THEY"} MUST CLEAR IT PAST THE ARC`, 500, 62, { size: 28, color: C.gold, center: true });
    [...m.messages].reverse().forEach(([msg], i) => text(msg, 500, 600 - i * 28, { size: i === 0 ? 32 : 24, center: true }));
    const ca = m.controlled, cb = m.ball;
    if (m.phase === "live" && cb.state === "held" && cb.holder === ca && !m.needsClear && m.meter === null) {

const SYM_COLORS = { BRICK: "#aa4632", BALL: C.orange, SHOE: C.white, CASH: C.green, CROWN: C.gold, MYTHIC: "#ff3b5c", ETERNAL: "#7ff9ff" };
const RARITY_COLORS = { Bum: C.grey, Solid: C.white, Baller: C.blue, Legend: C.gold, Mythic: "#ff3b5c", Eternal: "#7ff9ff" };
const symColor = s => s === "ETERNAL" ? rarityColor({ rainbow: true }) : s === "MYTHIC" ? rarityColor({ glow: true }) : SYM_COLORS[s];
const rarColorName = n => n === "Eternal" ? rarityColor({ rainbow: true }) : n === "Mythic" ? rarityColor({ glow: true }) : RARITY_COLORS[n];

class SlotScreen extends Screen {
  constructor() { super(); Object.assign(this, { bi: 1, spinT: 0, result: null, reels: ["BALL", "CROWN", "CASH"], msg: "Pick a bet and spin.", rng: new Rng() }); }
  spin() {
    if (this.spinT > 0) return;
    const bet = Luck.BETS[this.bi], res = Luck.playSlots(this.c, bet, this.rng);
    if (!res) { this.msg = "Not enough cash for that bet."; return; }
    this.result = [bet, ...res]; this.spinT = 1.2; App.save();
  }
  key(k) {
    if (this.spinT > 0) return;
    if (K.back(k)) App.switch(new HubScreen());
    else if (K.left(k)) this.bi = Math.max(0, this.bi - 1);
    else if (K.right(k)) this.bi = Math.min(Luck.BETS.length - 1, this.bi + 1);
    else if (K.ok(k)) this.spin();
  }
  update(dt) {
    if (this.spinT <= 0) return;
    this.spinT -= dt;
    if (this.spinT <= 0) {
      const [bet, reels, win] = this.result; this.reels = reels;
      const top = reels.filter(r => r === "ETERNAL").length >= 2 ? "ETERNAL" : reels.filter(r => r === "MYTHIC").length >= 2 ? "MYTHIC" : null;
      this.msg = top && win > bet ? `${top} HIT! +$${win}` : win > bet ? `WINNER! +$${win}` : win === bet ? "Push. You got your bet back." : "Brick. Better luck next time.";
    } else this.reels = [0, 1, 2].map(() => this.rng.choice(Luck.SYMBOLS));
  }
  draw() {
    this.header("Luck Machine"); if (this.spinT <= 0) this.backButton(() => App.switch(new HubScreen()));
    this.reels.forEach((sym, i) => {
      const x = 260 + i * 170;
      rrect(x, 165, 150, 150, 14, "#262835", C.gold, 3);
      if (sym === "ETERNAL") { rrect(x, 165, 150, 150, 14, "#262835", rainbow(x, 165, 150, 150), 4); ctx.save(); ctx.globalAlpha = 0.15; rrect(x, 165, 150, 150, 14, rainbow(x, 315, 150, -150)); ctx.restore(); }
      if (sym === "MYTHIC" || sym === "ETERNAL") { ctx.save(); ctx.shadowColor = symColor(sym); ctx.shadowBlur = 20; }
      text(sym, x + 75, 240, { size: sym.length > 6 ? 30 : 36, color: sym === "ETERNAL" ? rainbow(x + 10, 225, 130, 30) : symColor(sym), center: true, display: true });
      if (sym === "MYTHIC" || sym === "ETERNAL") ctx.restore();
      if (sym === "ETERNAL") shine(x, 165, 150, 150, 14);
    });
    const bet = Luck.BETS[this.bi];
    text(`Bet $${bet}`, 500, 360, { size: 50, center: true, display: true });
    text("◀", 330, 360, { size: 54, center: true }); hit(290, 330, 80, 60, () => { if (this.spinT <= 0) this.bi = Math.max(0, this.bi - 1); });
    text("▶", 670, 360, { size: 54, center: true }); hit(630, 330, 80, 60, () => { if (this.spinT <= 0) this.bi = Math.min(Luck.BETS.length - 1, this.bi + 1); });
    rrect(420, 395, 160, 52, 10, C.gold); text("SPIN", 500, 421, { size: 32, color: "#1a1406", center: true, display: true }); hit(420, 395, 160, 52, () => this.spin());
    text(this.msg, 500, 474, { size: 32, color: this.msg.startsWith("ETERNAL") ? rainbow(360, 460, 280, 28) : this.msg.startsWith("MYTHIC") ? symColor("MYTHIC") : this.msg.startsWith("WINNER") ? C.green : C.white, center: true });
    ["3 ETERNAL = 1000x  ·  3 MYTHIC = 100x  ·  3 CROWNS = 20x  ·  any 3 of a kind = 5x", "2 ETERNAL = 25x  ·  2 MYTHIC = 8x  ·  2 CASH or CROWNS = 2x  ·  other pair = bet back", "The machine wins over time. Don't bet what you need!"]
      .forEach((p, i) => text(p, 500, 520 + i * 28, { size: 24, color: C.grey, center: true, weight: 500 }));
    this.footer("◀ ▶ bet  ·  Space spin");
  }
}

class MysteryScreen extends Screen {
  constructor() { super(); Object.assign(this, { rng: new Rng(), reveal: null, msg: "" }); }
  roll() {
    const c = this.c;
    if (c.crew.length >= S.CREW_MAX) { this.msg = "Crew is full. Release someone in the Crew screen."; return; }
    const res = Luck.rollMystery(c, this.rng);
    if (!res) { this.msg = `Need $${Luck.mysteryCost(c.tier)}.`; return; }
    this.reveal = res; this.msg = ""; App.save();
  }
  key(k) { if (K.back(k)) App.switch(new HubScreen()); else if (K.ok(k)) this.roll(); }
  draw() {
    this.header("Mystery Baller"); this.backButton(() => App.switch(new HubScreen()));
    const c = this.c, cost = Luck.mysteryCost(c.tier);
    text(`Pay $${cost} for a random baller. Could be a Legend… could be a Bum.`, 500, 168, { size: 30, center: true });
    Luck.RARITIES.forEach(([name, pct], i) => { const x = 290 + (i % 3) * 210, y = 220 + Math.floor(i / 3) * 40; text(`${name}: ${pct}%`, x, y, { size: 30, color: name === "Eternal" ? rainbow(x - 80, y - 10, 160, 20) : rarColorName(name), center: true }); });
    text(`Your best crew member is OVR ${Math.max(...c.crew.map(overall))}  ·  Crew ${c.crew.length}/${S.CREW_MAX}`, 500, 338, { size: 23, color: C.grey, center: true, weight: 500 });
    if (this.reveal) {
      const [rarity, p] = this.reveal;
      const rc = rarColorName(rarity), top = rarity === "Mythic" || rarity === "Eternal";
      const et = rarity === "Eternal";
      if (top) { ctx.save(); ctx.shadowColor = rc; ctx.shadowBlur = 28; }
      rrect(250, 364, 500, 180, 14, "#262835", et ? rainbow(250, 364, 500, 180) : rc, et ? 6 : 4);
      if (top) ctx.restore();
      text(rarity.toUpperCase(), 500, 396, { size: 44, color: et ? rainbow(380, 380, 240, 30) : rc, center: true, display: true });
      if (et) shine(250, 364, 500, 180, 14);
      text(`#${p.number} ${p.name}  OVR ${overall(p)}`, 500, 442, { size: 34, center: true });
      text(statLine(p), 500, 482, { size: 22, color: C.grey, center: true, weight: 500 });
      text(attrLabel(p), 500, 512, { size: 22, color: C.grey, center: true, weight: 500 });
    }
    rrect(400, 560, 200, 52, 10, C.gold); text(`ROLL $${cost}`, 500, 586, { size: 28, color: "#1a1406", center: true, display: true }); hit(400, 560, 200, 52, () => this.roll());
    if (this.msg) text(this.msg, 500, 636, { size: 26, color: C.red, center: true });
  }
}

// =====================================================================
// Input wiring
// =====================================================================
const GAME_KEYS = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "]);
window.addEventListener("keydown", e => {
  Sound.wake();
  if ((e.key === "m" || e.key === "M") && e.target !== nameInput) { Sound.on = !Sound.on; }
  if (e.target === nameInput) {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Enter" || e.key === "Escape") { e.preventDefault(); App.screen.key(e.key); }
    return;
  }
  if (GAME_KEYS.has(e.key)) e.preventDefault();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
  if (!e.repeat) {
    if (e.key === " ") App.edges.shootPressed = true;
    if (k === "j") App.edges.passPressed = true;
    if (k === "k") App.edges.movePressed = true;
    if (k === "q") App.edges.switchPressed = true;
    if (!(App.screen instanceof MatchScreen) || ["Escape", "p", "P", "f", "F"].includes(e.key)) App.screen.key(e.key);
  }
  App.keys.add(k);
});
window.addEventListener("keyup", e => App.keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase()));
window.addEventListener("blur", () => { App.keys.clear(); for (const d in App.touch) App.touch[d] = false; });
canvas.addEventListener("pointerdown", e => {
  Sound.wake();
  canvas.focus();
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * S.W, y = (e.clientY - r.top) / r.height * S.H;
  for (const h of [...App.hits].reverse()) if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { h.fn(); return; }
});
for (const btn of pad.querySelectorAll("[data-dir]")) {
  const d = btn.dataset.dir;
  const on = e => { e.preventDefault(); App.touch[d] = true; btn.classList.add("on"); };
  const off = e => { e.preventDefault(); App.touch[d] = false; btn.classList.remove("on"); };
  btn.addEventListener("pointerdown", on); btn.addEventListener("pointerup", off); btn.addEventListener("pointerleave", off); btn.addEventListener("pointercancel", off);
}
const shootBtn = document.getElementById("b-shoot");
shootBtn.addEventListener("pointerdown", e => { e.preventDefault(); App.touch.shoot = true; App.edges.shootPressed = true; });
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) shootBtn.addEventListener(ev, () => { App.touch.shoot = false; });
const sprintBtn = document.getElementById("b-sprint");
sprintBtn.addEventListener("pointerdown", e => { e.preventDefault(); Sound.wake(); App.touch.sprint = true; sprintBtn.classList.add("on"); });
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) sprintBtn.addEventListener(ev, () => { App.touch.sprint = false; sprintBtn.classList.remove("on"); });
document.getElementById("b-pass").addEventListener("pointerdown", e => { e.preventDefault(); App.edges.passPressed = true; });
document.getElementById("b-move").addEventListener("pointerdown", e => { e.preventDefault(); App.edges.movePressed = true; });
document.getElementById("b-switch").addEventListener("pointerdown", e => { e.preventDefault(); App.edges.switchPressed = true; });
document.getElementById("b-pause").addEventListener("pointerdown", e => { e.preventDefault(); App.screen.key("Escape"); });
if (isTouch) document.getElementById("hint").textContent = "Tap menus to pick. In a game, use the buttons below. Hold SHOOT and let go in the green.";

// =====================================================================
// Main loop
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  App.screen.update(dt);
  App.hits = [];
  App.screen.draw();
  requestAnimationFrame(frame);
}
function start(data) {
  if (data && data.career) { App.career = new Career(data.career); App.switch(new HubScreen()); }
  else App.switch(new TitleScreen());
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ career: App.career ? JSON.parse(JSON.stringify(App.career)) : null }));
const boot = () => window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load('20px Bungee'), document.fonts.load('700 20px "Barlow Semi Condensed"'), document.fonts.load('500 20px "Barlow Semi Condensed"')]).catch(() => {}) : Promise.resolve()).then(boot, boot);
// Test hook (used only by automated checks)
window.__SK = { MarketScreen, bracket, App, Match, Career, Luck, Rng, crewPlayers, overall, blankInputs, MatchScreen, HubScreen, CourtScreen, AttrScreen, SlotScreen, ResultScreen };
